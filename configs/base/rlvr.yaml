run:
  mode: rlvr

data:
  type: rlvr_allenai
  source: hf
  max_prompt_len: 384
  num_proc: 12
  cache_dir: null

training:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 16
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  learning_rate: 1.0e-5
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 50
  logging_steps: 1
  save_strategy: "no"

grpo:
  max_prompt_length: 384
  max_completion_length: 400
  scale_rewards: group
  epsilon: 0.10
  temperature: 0.9
  top_p: 1.0
  top_k: 50
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.5
  vllm_enable_sleep_mode: true

topk_eval:
  enabled: true
  mode: gsm
  k: 10
  eval_dataset_path: held_out/gsm_eval_v2.jsonl
  eval_every_n_steps: 10
  eval_batch_size: 32
  source_type: local
  reward_function: ppo_binary
