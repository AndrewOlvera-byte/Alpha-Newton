# Base config for robotics BC / RL training
# Overrides common.yaml defaults for robomimic-style tasks

data:
  type: "robomimic_bc"
  data_dir: "data/robomimic"
  tasks:
    - "lift"
  history_length: 3
  image_size: 84
  obs_keys:
    low_dim:
      - "robot0_eef_pos"
      - "robot0_eef_quat"
      - "robot0_gripper_qpos"
      - "object-state"
    image:
      - "agentview_image"
      - "robot0_eye_in_hand_image"
  eval_ratio: 0.1
  hdf5_filter_key: null

robotics:
  architecture:
    type: null       # set in experiment config
    # Model dims
    d_model: 384
    n_transformer_layers: 6
    n_transformer_heads: 6
    d_ff: 1536
    d_dit: 256
    n_dit_layers: 4
    n_dit_heads: 4
    d_dit_ff: 1024
    dropout: 0.1
    encoder_hidden_dim: 128
    # Task params
    action_dim: 7
    obs_dim: 19        # eef_pos(3) + eef_quat(4) + gripper_qpos(2) + object-state(10)
    n_cameras: 2
    history_length: 3
    # ViT
    vit_model: "facebook/dinov2-small"
    vit_img_size: 224
    freeze_vit: true
    # Vision token pooling: pool DINOv2's 256 patches down to N per camera.
    # 64 → sequence: 2*64+2=130 tokens/frame → 3*130+1=391 total (vs 1543 raw).
    # 0 = disable pooling (use all 256 patches — slower but highest fidelity).
    vis_tokens_per_camera: 64
    # Flow matching
    num_flow_steps: 10
    # Training
    gradient_checkpointing: false

training:
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  warmup_steps: 500
  max_steps: 50000
  max_grad_norm: 1.0
  logging_steps: 50
  save_steps: 5000
  eval_steps: 5000
  bf16: true
  fp8: false
  torch_compile: false
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  gradient_checkpointing: false
  output_dir: "outputs/${run.name}"

wandb:
  project: "robotics-bc"
  entity: "andrewolvera"
  run_name: "${run.name}"
  tags: []
