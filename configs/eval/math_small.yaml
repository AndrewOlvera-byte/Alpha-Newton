# Math eval suite (small): GSM8K only — fast dev/sanity check
# For paper-quality reporting use math_paper_hf.yaml (HF) or math_paper_gsm.yaml (vLLM)

suite:
  name: "math_small"

runner:
  backend: "lm_eval"
  model: "hf"

  tasks: ["gsm8k"]

  num_fewshot: 0
  batch_size: 64  # Was 16 — 4x fewer batches, ~4x faster (~10 min on single GPU)

  apply_chat_template: true
  gen_kwargs:
    do_sample: false
    temperature: 0.0
    max_new_tokens: 512  # Cap generation — GSM8K answers are short, prevents runaway decoding

output:
  path: null
