# Flightmare drone state-only BC: collective-thrust + body-rates target.
# Inputs: 13-dim drone state ++ 14-dim privileged mission (next-3-gates body-frame
#         + gate progress + dist-to-next) -> 27-dim flat state.
# Target: 4-dim CTBR (thrust_norm, wx, wy, wz), Gaussian NLL.
#
# Run:
#   python -m src.entrypoints.train_bc --exp flightmare/flightmare_ctbr_bc_state --test   # smoke
#   python -m src.entrypoints.train_bc --exp flightmare/flightmare_ctbr_bc_state          # train

run:
  name: flightmare_ctbr_bc_state_v1
  mode: bc
  seed: 0

data:
  type: flightmare_bc_state
  data_dir: data/flightmare/bc_v1
  action_type: ctbr
  include_mission: true
  normalize_state: true
  normalize_action: true
  normalize_mission: true

robotics:
  architecture:
    type: flightmare_ctbr_bc_state

    # Inputs (state already concat with mission inside the dataset).
    state_dim: 27
    action_dim: 4
    use_vision: false
    include_prev_action: true

    # State / action encoders.
    state_hidden_dim: 256
    state_embed_dim: 256

    # Fused trunk - the main capacity. Vision savings (~11M frozen params)
    # buy us a bigger MLP without exceeding the modest GPU footprint.
    trunk_hidden_dim: 512
    trunk_depth: 3
    dropout: 0.1

    # Gaussian action head (state-dependent log_std for true Gaussian NLL).
    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: true
    init_log_std: -1.0
    log_std_min: -5.0
    log_std_max: 1.0

    # BC: critic disabled, NLL loss.
    with_critic: false
    bc_loss_type: gnll
    action_clip: 5.0

training:
  trainer_type: bc_flow_matching_robosuite
  per_device_train_batch_size: 1024
  per_device_eval_batch_size: 1024
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 1000
  max_steps: 40000
  max_grad_norm: 5.0
  logging_steps: 100
  save_steps: 5000
  eval_steps: 1000
  bf16: true
  fp8: false
  torch_compile: false
  dataloader_num_workers: 2
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  selection_metric: eval_loss
  early_stopping_patience: 10
  output_dir: outputs/${run.name}

wandb:
  project: flightmare-bc
  entity: andrewolvera
  run_name: ${run.name}
  tags:
    - flightmare
    - bc
    - state-only
    - ctbr
