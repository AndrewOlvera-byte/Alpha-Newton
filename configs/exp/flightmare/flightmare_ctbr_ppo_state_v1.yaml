# PPO fine-tuning for state-only Flightmare CTBR racing policy.

run:
  name: flightmare_ctbr_ppo_state_v1
  mode: ppo
  seed: 0

data:
  type: flightmare_ppo_state
  data_dir: data/flightmare/bc_v1
  action_type: ctbr
  include_mission: true
  normalize_state: true
  normalize_action: true
  normalize_mission: true

robotics:
  architecture:
    type: flightmare_ctbr_ppo_state
    bc_checkpoint: outputs/flightmare_ctbr_bc_state_v1/best/model.pt

    state_dim: 27
    action_dim: 4
    use_vision: false
    include_prev_action: true

    state_hidden_dim: 256
    state_embed_dim: 256
    trunk_hidden_dim: 512
    trunk_depth: 3
    dropout: 0.05

    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: false
    init_log_std: -1.0
    log_std_min: -5.0
    log_std_max: 0.5
    with_critic: true
    critic_hidden_dim: 256
    critic_depth: 2
    bc_loss_type: gnll
    action_clip: 5.0

  ppo:
    bc_checkpoint: outputs/flightmare_ctbr_bc_state_v1/best/model.pt
    action_type: ctbr
    n_envs: 16
    n_steps: 256
    ppo_epochs: 4
    minibatch_size: 1024
    clip_eps: 0.15
    vf_coeff: 0.5
    ent_coeff: 0.003
    gamma: 0.995
    gae_lambda: 0.95
    max_iterations: 1000
    actor_lr: 2.0e-5
    critic_lr: 1.0e-4

    control_hz: 100.0
    horizon: 1500
    scene: industrial
    render: false
    # Flightmare's VisualRacingEnv binding binds a single ZMQ endpoint, so
    # vectorized PPO uses the state-only numpy dynamics backend. Use eval
    # with --fail-on-fallback for real Flightmare checkpoint validation.
    backend: numpy
    num_gates: 8
    gate_spacing_range: [4.0, 9.0]
    gate_lateral_jitter: 2.0
    gate_z_range: [1.5, 4.0]
    gate_yaw_step: 0.7
    gate_yaw_noise: 0.25
    gate_size: 1.0
    z_min: 1.0

    gate_vehicle_radius: 0.15
    max_world_radius: 120.0
    min_z: -0.25
    terminate_on_gate_miss: true
    terminate_on_crash: true
    max_body_rate: 8.0

    reward_fn: flightmare_racing_v1
    reward_kwargs:
      progress_scale: 8.0
      segment_progress_scale: 1.0
      gate_pass_bonus: 12.0
      completion_bonus: 75.0
      gate_miss_penalty: 25.0
      crash_penalty: 30.0
      time_penalty: 0.02
      body_rate_penalty: 0.002
      action_smoothness_penalty: 0.01
      alignment_scale: 0.05
      max_progress_reward: 2.0

training:
  trainer_type: ppo_flightmare
  max_grad_norm: 0.5
  logging_steps: 1
  save_steps: 25
  save_total_limit: 5
  save_final: true
  save_optimizer_state: false
  bf16: true
  output_dir: outputs/${run.name}

wandb:
  project: flightmare-ppo
  entity: andrewolvera
  run_name: ${run.name}
  tags:
    - flightmare
    - ppo
    - state-only
    - ctbr
