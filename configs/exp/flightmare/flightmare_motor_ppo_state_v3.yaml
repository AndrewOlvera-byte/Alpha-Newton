# PPO fine-tuning for v3 Swift-scale per-motor racing.
# This is the 4-motor actuator ablation; CTBR is intentionally not used.

run:
  name: flightmare_motor_ppo_state_v3
  mode: ppo
  seed: 0

data:
  type: flightmare_ppo_state
  data_dir: data/flightmare/bc_v3_swift_like
  action_type: motor
  include_mission: true
  normalize_state: true
  normalize_action: true
  action_normalization: bounds
  normalize_mission: true

robotics:
  architecture:
    type: flightmare_motor_ppo_state
    bc_checkpoint: outputs/flightmare_motor_bc_state_v3/best/model.pt

    state_dim: 27
    action_dim: 4
    use_vision: false
    include_prev_action: true

    state_hidden_dim: 256
    state_embed_dim: 256
    trunk_hidden_dim: 512
    trunk_depth: 3
    dropout: 0.05

    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: false
    init_log_std: -0.65
    log_std_min: -5.0
    log_std_max: 0.4
    with_critic: true
    critic_hidden_dim: 256
    critic_depth: 2
    bc_loss_type: gnll
    action_clip: 1.2

  ppo:
    bc_checkpoint: outputs/flightmare_motor_bc_state_v3/best/model.pt
    action_type: motor
    n_envs: 128
    n_steps: 2000
    ppo_epochs: 3
    minibatch_size: 65536
    clip_eps: 0.10
    vf_coeff: 0.5
    ent_coeff: 0.002
    gamma: 0.995
    gae_lambda: 0.95
    max_iterations: 2200
    actor_lr: 1.5e-5
    critic_lr: 3.0e-4
    target_kl: 0.035

    control_hz: 100.0
    horizon: 2500
    scene: industrial
    render: false
    backend: numpy
    course_mode: swift_like
    random_start_gate: true
    fixed_gate_pos_noise: 0.15
    fixed_gate_yaw_noise: 0.05
    num_gates: 7
    gate_spacing_range: [10.0, 20.0]
    gate_lateral_jitter: 0.0
    gate_z_range: [1.5, 6.0]
    gate_yaw_step: 0.0
    gate_yaw_noise: 0.0
    gate_size: 1.6
    z_min: 1.0

    gate_vehicle_radius: 0.15
    max_world_radius: 350.0
    min_z: -0.25
    terminate_on_gate_miss: true
    terminate_on_crash: true
    max_collective_thrust_g: 5.5
    action_clip: 1.2

    reward_fn: flightmare_racing_v1
    reward_kwargs:
      progress_scale: 6.0
      segment_progress_scale: 1.5
      gate_pass_bonus: 20.0
      completion_bonus: 220.0
      gate_miss_penalty: 90.0
      crash_penalty: 100.0
      time_penalty: 0.04
      body_rate_penalty: 0.0
      action_smoothness_penalty: 0.02
      alignment_scale: 0.05
      gate_centering_penalty: 0.05
      gate_violation_penalty: 0.20
      gate_centering_near_m: 8.0
      max_progress_reward: 5.0

training:
  trainer_type: ppo_flightmare
  max_grad_norm: 0.5
  logging_steps: 1
  save_steps: 25
  save_total_limit: 8
  save_final: true
  save_optimizer_state: false
  best_steps: 1
  selection_metric: rollout_score
  rollout_score_weights:
    success_rate: 1.0
    mean_gate_completion: 0.1
    mean_speed_mps: 0.02
    mean_reward: 0.0

  bf16: true
  output_dir: outputs/${run.name}

wandb:
  project: flightmare-ppo
  entity: andrewolvera
  run_name: ${run.name}
  tags:
    - flightmare
    - ppo
    - state-only
    - motor
    - v3
    - swift-like
    - bounds-norm
    - best-every-rollout
