# DEPRECATED NOW USING FLIGHTMARE BACKEND IN /paper
# PPO fine-tuning for state-only Flightmare waypoint+LQR racing policy.
# v2 keeps the best policy from any rollout, not only periodic checkpoints.

run:
  name: flightmare_waypoint_ppo_state_v2
  mode: ppo
  seed: 0

data:
  type: flightmare_ppo_state
  data_dir: data/flightmare/bc_v1
  action_type: waypoint
  include_mission: true
  normalize_state: true
  normalize_action: true
  normalize_mission: true

robotics:
  architecture:
    type: flightmare_waypoint_ppo_state
    bc_checkpoint: outputs/flightmare_waypoint_bc_state_v1/best/model.pt

    state_dim: 27
    action_dim: 4
    use_vision: false
    include_prev_action: true

    state_hidden_dim: 256
    state_embed_dim: 256
    trunk_hidden_dim: 512
    trunk_depth: 3
    dropout: 0.05

    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: false
    init_log_std: -0.8
    log_std_min: -5.0
    log_std_max: 0.5
    with_critic: true
    critic_hidden_dim: 256
    critic_depth: 2
    bc_loss_type: gnll
    action_clip: 5.0

  ppo:
    bc_checkpoint: outputs/flightmare_waypoint_bc_state_v1/best/model.pt
    action_type: waypoint
    n_envs: 64
    n_steps: 1500
    ppo_epochs: 3
    minibatch_size: 16384
    clip_eps: 0.10
    vf_coeff: 0.5
    ent_coeff: 0.003
    gamma: 0.995
    gae_lambda: 0.95
    max_iterations: 1500
    actor_lr: 3.0e-5
    critic_lr: 3.0e-4
    target_kl: 0.03

    control_hz: 100.0
    horizon: 1500
    scene: industrial
    render: false
    # Flightmare's VisualRacingEnv binding binds a single ZMQ endpoint, so
    # vectorized PPO uses the state-only numpy dynamics backend. Use eval
    # with --fail-on-fallback for real Flightmare checkpoint validation.
    backend: numpy
    num_gates: 8
    gate_spacing_range: [4.0, 9.0]
    gate_lateral_jitter: 2.0
    gate_z_range: [1.5, 4.0]
    gate_yaw_step: 0.7
    gate_yaw_noise: 0.25
    gate_size: 1.0
    z_min: 1.0

    gate_vehicle_radius: 0.15
    max_world_radius: 120.0
    min_z: -0.25
    terminate_on_gate_miss: true
    terminate_on_crash: true
    max_waypoint_speed: 15.0
    action_clip: 5.0

    reward_fn: flightmare_racing_v1
    reward_kwargs:
      progress_scale: 6.0
      segment_progress_scale: 1.0
      gate_pass_bonus: 20.0
      completion_bonus: 150.0
      gate_miss_penalty: 60.0
      crash_penalty: 75.0
      time_penalty: 0.02
      body_rate_penalty: 0.001
      action_smoothness_penalty: 0.02
      alignment_scale: 0.05
      gate_centering_penalty: 0.08
      gate_violation_penalty: 0.20
      gate_centering_near_m: 4.0
      max_progress_reward: 2.0

training:
  trainer_type: ppo_flightmare
  max_grad_norm: 0.5
  logging_steps: 1

  # Regular retained checkpoints are still sparse; best is checked every rollout.
  save_steps: 25
  save_total_limit: 8
  save_final: true
  save_optimizer_state: false
  best_steps: 1
  selection_metric: rollout_score
  rollout_score_weights:
    success_rate: 1.0
    mean_gate_completion: 0.1
    mean_speed_mps: 0.01
    mean_reward: 0.0

  bf16: true
  output_dir: outputs/${run.name}

wandb:
  project: flightmare-ppo
  entity: andrewolvera
  run_name: ${run.name}
  tags:
    - flightmare
    - ppo
    - state-only
    - waypoint
    - v2
    - best-every-rollout
