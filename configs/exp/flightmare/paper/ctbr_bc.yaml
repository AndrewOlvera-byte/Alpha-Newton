# Paper ablation — BC pretraining on REAL Flightmare dynamics.
# Action space: CTBR (collective thrust normalized + body rates wx, wy, wz).
# Architecture: unified flightmare_actor (mode=bc, action_type=ctbr).
# Data:         data/flightmare/bc_v4 (collected via collect_v4.sh, flightgym).
#
# Same hyperparameters as waypoint_bc.yaml / motor_bc.yaml so the ablation
# isolates the action-space effect.
#
# Run after collection:
#   docker compose exec alpha-newton python -m src.entrypoints.train_bc \
#     --exp flightmare/paper/ctbr_bc

run:
  name: paper_ctbr_bc_v4
  mode: bc
  seed: 0

data:
  type: flightmare_bc_state_v3
  data_dir: data/flightmare/bc_v4
  action_type: ctbr
  normalize_obs: true
  normalize_action: true
  action_normalization: bounds

robotics:
  architecture:
    type: flightmare_actor
    mode: bc
    action_type: ctbr

    # Swift split-then-fuse: 9 proprio_core + 24 gate corners + 3 aux = 36-d state
    fusion: swift
    proprio_core_dim: 9
    gate_dim: 24
    aux_dim: 3
    action_dim: 4
    use_vision: false
    include_prev_action: true

    proprio_hidden_dim: 128
    proprio_embed_dim: 128
    gate_hidden_dim: 128
    gate_embed_dim: 128
    trunk_hidden_dim: 768
    trunk_depth: 3
    dropout: 0.1

    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: true
    init_log_std: -1.0
    log_std_min: -5.0
    log_std_max: 0.5

    with_critic: false
    bc_loss_type: gnll
    action_clip: 1.2

training:
  trainer_type: bc_flow_matching_robosuite
  per_device_train_batch_size: 16384
  per_device_eval_batch_size: 16384
  gradient_accumulation_steps: 1
  learning_rate: 7.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 1500
  max_steps: 10000
  max_grad_norm: 5.0
  logging_steps: 50
  save_steps: 1000
  eval_steps: 250
  bf16: true
  fp8: false
  torch_compile: false
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 4
  selection_metric: eval_loss
  early_stopping_patience: 8
  output_dir: outputs/${run.name}

wandb:
  project: flightmare-bc
  entity: andrewolvera
  run_name: ${run.name}
  tags: [flightmare, bc, state-only, ctbr, v4, paper, flightgym-backend]
