# CTBR PPO continuation after stage23: partial course -> full 7-gate reliability
# -> full 7-gate speed catchup.
#
# Intended seed checkpoint:
#   outputs/paper_ctbr_stage23_ppo_v5/final/model.pt
#
# To resume this stage4 run after an interruption/OOM, point both
# bc_checkpoint entries and robotics.ppo.resume_from at the latest
# outputs/${run.name}/checkpoint-*/ directory.
#
# Run after stage23 completes:
#   docker compose exec alpha-newton python -m src.entrypoints.train_ppo \
#     --exp flightmare/paper/ctbr_stage4_full_speed_ppo

run:
  name: paper_ctbr_stage4_full_speed_ppo_v5
  mode: ppo
  seed: 0

data:
  type: flightmare_ppo_state
  data_dir: data/flightmare/bc_v4
  action_type: ctbr
  obs_schema: v3
  normalize_state: true
  normalize_action: true
  action_normalization: bounds

robotics:
  architecture:
    type: flightmare_actor
    mode: ppo
    action_type: ctbr
    bc_checkpoint: outputs/paper_ctbr_stage23_ppo_v5/final/model.pt

    fusion: swift
    proprio_core_dim: 9
    gate_dim: 24
    aux_dim: 3
    action_dim: 4
    use_vision: false
    include_prev_action: true

    proprio_hidden_dim: 128
    proprio_embed_dim: 128
    gate_hidden_dim: 128
    gate_embed_dim: 128
    trunk_hidden_dim: 768
    trunk_depth: 3
    dropout: 0.05

    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: false
    init_log_std: -2.0
    log_std_min: -4.0
    log_std_max: -1.2
    with_critic: true
    critic_hidden_dim: 256
    critic_depth: 2
    bc_loss_type: gnll
    action_clip: 1.0

  ppo:
    bc_checkpoint: outputs/paper_ctbr_stage23_ppo_v5/final/model.pt
    action_type: ctbr

    obs_schema: v3
    backend: flightgym
    render: false
    scene: industrial

    n_envs: 16
    n_workers: 16
    n_steps: 512
    ppo_epochs: 4
    minibatch_size: 2048
    clip_eps: 0.06
    vf_coeff: 0.5
    ent_coeff: 0.0008
    gamma: 0.997
    gae_lambda: 0.95
    max_iterations: 22000
    actor_lr: 6.0e-6
    critic_lr: 2.0e-4
    target_kl: 0.020

    control_hz: 100.0
    horizon: 2500

    course_mode: swift_v4
    num_gates: 7
    gate_size: 1.6
    gate_approach_m: 3.0
    z_min: 1.0
    fixed_gate_pos_noise: 0.00
    fixed_gate_yaw_noise: 0.00
    random_start_gate: false
    reset_mode: segment_window
    start_offset_m: 3.0
    start_offset_range: [2.0, 4.0]
    reference_speed_mps: 4.0
    goal_mode: gate_i_to_i+2

    gate_vehicle_radius: 0.20
    max_world_radius: 350.0
    min_z: -0.25
    terminate_on_gate_miss: true
    terminate_on_crash: true
    max_body_rate: 8.0
    max_collective_thrust_g: 5.5
    action_clip: 1.0

    reward_fn: flightmare_racing_v3
    reward_kwargs:
      gate_normal_progress_scale: 6.0
      segment_progress_scale: 1.5
      centerline_progress_scale: 4.0
      centerline_error_penalty: 0.06
      aperture_near_penalty: 1.0
      aperture_near_m: 4.0
      velocity_alignment_scale: 0.08
      body_alignment_scale: 0.06
      gate_pass_bonus: 28.0
      segment_completion_bonus: 8.0
      completion_bonus: 180.0
      gate_miss_penalty: 85.0
      crash_penalty: 95.0
      no_progress_penalty: 0.08
      backward_progress_penalty: 2.0
      min_forward_velocity_mps: 0.75
      stall_grace_steps: 25
      time_penalty: 0.015
      body_rate_penalty: 0.0007
      action_smoothness_penalty: 0.006
      vertical_speed_penalty: 0.001
      max_progress_reward: 3.0
      max_centerline_progress: 2.0
      max_centerline_error: 6.0

    curriculum:
      enabled: true
      advance_metric: null
      advance_threshold: 1.0
      stages:
        - name: stage3_three_gate_consolidation
          until_iter: 2500
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.0
          fixed_gate_yaw_noise: 0.0
          reset_mode: segment_window
          start_gate_choices: [0, 1, 2, 3, 4]
          start_offset_range: [2.0, 4.0]
          goal_mode: gate_i_to_i+2
          horizon: 1400
          ent_coeff_override: 0.0009

        - name: stage4_five_gate_windows
          until_iter: 6500
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.0
          fixed_gate_yaw_noise: 0.0
          reset_mode: segment_window
          start_gate_choices: [0, 1, 2]
          start_offset_range: [2.0, 4.0]
          goal_gate_span: 5
          goal_mode: finish_remaining_course
          horizon: 2100
          ent_coeff_override: 0.0008

        - name: stage5_partial_remaining_course
          until_iter: 10500
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.0
          fixed_gate_yaw_noise: 0.0
          reset_mode: reference_state
          start_gate_choices: [0, 1, 2, 3]
          start_offset_range: [2.0, 4.0]
          goal_gate_span: null
          goal_mode: finish_remaining_course
          horizon: 2500
          ent_coeff_override: 0.0007

        - name: stage6_full_course_reliability
          until_iter: 14500
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.0
          fixed_gate_yaw_noise: 0.0
          reset_mode: course_start
          start_gate_choices: null
          start_offset_range: null
          goal_gate_span: null
          goal_mode: finish_remaining_course
          horizon: 2800
          ent_coeff_override: 0.0006

        - name: stage7_full_course_speed_catchup
          until_iter: 18500
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.0
          fixed_gate_yaw_noise: 0.0
          reset_mode: course_start
          start_gate_choices: null
          start_offset_range: null
          goal_gate_span: null
          goal_mode: finish_remaining_course
          horizon: 2400
          ent_coeff_override: 0.0004
          reward_kwargs:
            gate_normal_progress_scale: 5.0
            segment_progress_scale: 1.25
            centerline_progress_scale: 3.25
            centerline_error_penalty: 0.05
            aperture_near_penalty: 1.0
            aperture_near_m: 4.0
            velocity_alignment_scale: 0.11
            body_alignment_scale: 0.05
            gate_pass_bonus: 28.0
            segment_completion_bonus: 8.0
            completion_bonus: 180.0
            gate_miss_penalty: 90.0
            crash_penalty: 100.0
            no_progress_penalty: 0.10
            backward_progress_penalty: 2.0
            min_forward_velocity_mps: 1.25
            stall_grace_steps: 25
            time_penalty: 0.035
            body_rate_penalty: 0.0008
            action_smoothness_penalty: 0.006
            vertical_speed_penalty: 0.001
            thrust_saturation_penalty: 0.001
            max_progress_reward: 3.0
            max_centerline_progress: 2.0
            max_centerline_error: 6.0

        - name: stage8_full_course_speed_with_light_noise
          until_iter: 22000
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.05
          fixed_gate_yaw_noise: 0.01
          reset_mode: course_start
          start_gate_choices: null
          start_offset_range: null
          goal_gate_span: null
          goal_mode: finish_remaining_course
          horizon: 2400
          ent_coeff_override: 0.00035
          reward_kwargs:
            gate_normal_progress_scale: 5.0
            segment_progress_scale: 1.25
            centerline_progress_scale: 3.25
            centerline_error_penalty: 0.05
            aperture_near_penalty: 1.0
            aperture_near_m: 4.0
            velocity_alignment_scale: 0.12
            body_alignment_scale: 0.05
            gate_pass_bonus: 28.0
            segment_completion_bonus: 8.0
            completion_bonus: 180.0
            gate_miss_penalty: 95.0
            crash_penalty: 105.0
            no_progress_penalty: 0.10
            backward_progress_penalty: 2.0
            min_forward_velocity_mps: 1.25
            stall_grace_steps: 25
            time_penalty: 0.04
            body_rate_penalty: 0.0008
            action_smoothness_penalty: 0.006
            vertical_speed_penalty: 0.001
            thrust_saturation_penalty: 0.001
            max_progress_reward: 3.0
            max_centerline_progress: 2.0
            max_centerline_error: 6.0

training:
  trainer_type: ppo_flightmare
  max_grad_norm: 0.5
  logging_steps: 1
  save_steps: 50
  save_total_limit: 80
  save_final: true
  save_optimizer_state: true
  best_steps: 1
  selection_metric: rollout_score
  rollout_score_weights:
    success_rate: 1.0
    mean_gate_completion: 0.25
    mean_speed_mps: 0.015
    mean_reward: 0.0

  bf16: true
  output_dir: outputs/${run.name}

wandb:
  project: flightmare-ppo
  entity: andrewolvera
  run_name: ${run.name}
  tags: [flightmare, ppo, state-only, ctbr, v5, stage4-full-speed, transition-reward, fast-fit]
