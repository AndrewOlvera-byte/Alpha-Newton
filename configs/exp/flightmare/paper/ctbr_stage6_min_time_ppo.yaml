# CTBR PPO fixed-course champion-lap fine-tune from the best stage4 checkpoint.
#
# Seed:
#   outputs/paper_ctbr_stage4_full_speed_ppo_v5/checkpoint-21800/model.pt
#
# Goal:
#   Final single-step full-course speed push. The reward keeps dense path/gate
#   progress as the main lap-time proxy, credits speed only while the policy is
#   on a viable gate corridor, and pays fast-completion bonus only on success.
#   This is intentionally not another curriculum stage stack.
#
# Run:
#   docker compose exec alpha-newton python -m src.entrypoints.train_ppo \
#     --exp flightmare/paper/ctbr_stage6_min_time_ppo

run:
  name: paper_ctbr_stage6_champion_lap_ppo_v3
  mode: ppo
  seed: 0

data:
  type: flightmare_ppo_state
  data_dir: data/flightmare/bc_v4
  action_type: ctbr
  obs_schema: v3
  normalize_state: true
  normalize_action: true
  action_normalization: bounds

robotics:
  architecture:
    type: flightmare_actor
    mode: ppo
    action_type: ctbr
    bc_checkpoint: outputs/paper_ctbr_stage4_full_speed_ppo_v5/checkpoint-21800/model.pt

    fusion: swift
    proprio_core_dim: 9
    gate_dim: 24
    aux_dim: 3
    action_dim: 4
    use_vision: false
    include_prev_action: true

    proprio_hidden_dim: 128
    proprio_embed_dim: 128
    gate_hidden_dim: 128
    gate_embed_dim: 128
    trunk_hidden_dim: 768
    trunk_depth: 3
    dropout: 0.05

    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: false
    init_log_std: -2.4
    log_std_min: -4.0
    log_std_max: -1.8
    with_critic: true
    critic_hidden_dim: 256
    critic_depth: 2
    bc_loss_type: gnll
    action_clip: 1.0

  ppo:
    bc_checkpoint: outputs/paper_ctbr_stage4_full_speed_ppo_v5/checkpoint-21800/model.pt
    action_type: ctbr

    obs_schema: v3
    backend: flightgym
    render: false
    scene: industrial

    n_envs: 32
    n_workers: 32
    n_steps: 384
    ppo_epochs: 2
    minibatch_size: 3072
    clip_eps: 0.035
    vf_coeff: 0.5
    ent_coeff: 0.00008
    gamma: 0.997
    gae_lambda: 0.95
    max_iterations: 12000
    actor_lr: 1.8e-6
    critic_lr: 1.5e-4
    target_kl: 0.006

    control_hz: 100.0
    horizon: 1400

    course_mode: swift_v4
    num_gates: 7
    gate_size: 1.6
    gate_approach_m: 3.0
    z_min: 1.0
    fixed_gate_pos_noise: 0.00
    fixed_gate_yaw_noise: 0.00
    random_start_gate: false
    reset_mode: course_start
    start_offset_m: 3.0
    start_offset_range: null
    reference_speed_mps: 4.0
    goal_mode: finish_remaining_course

    gate_vehicle_radius: 0.20
    max_world_radius: 350.0
    min_z: -0.25
    terminate_on_gate_miss: true
    terminate_on_crash: true
    max_body_rate: 8.0
    max_collective_thrust_g: 5.5
    action_clip: 1.0

    reward_fn: flightmare_racing_v6_champion_lap
    reward_kwargs:
      gate_normal_progress_scale: 5.0
      segment_progress_scale: 2.0
      centerline_progress_scale: 3.0
      centerline_error_penalty: 0.065
      centerline_error_power: 1.35
      aperture_near_penalty: 1.8
      aperture_near_m: 5.5
      speed_reward_scale: 0.07
      speed_cap_mps: 18.0
      speed_centerline_window: 1.75
      speed_gate_near_m: 8.0
      overspeed_error_penalty: 0.045
      overspeed_gate_near_m: 7.0
      velocity_alignment_scale: 0.05
      body_alignment_scale: 0.04
      gate_pass_bonus: 28.0
      gate_pass_speed_bonus_scale: 0.80
      gate_pass_speed_cap_mps: 18.0
      gate_margin_bonus_scale: 2.0
      segment_completion_bonus: 7.0
      completion_bonus: 240.0
      completion_time_target_s: 8.0
      completion_time_bonus_scale: 34.0
      completion_time_floor_s: 5.6
      gate_miss_penalty: 380.0
      gate_miss_margin_penalty: 130.0
      crash_penalty: 380.0
      no_progress_penalty: 0.14
      backward_progress_penalty: 2.5
      min_forward_velocity_mps: 1.5
      stall_grace_steps: 25
      time_penalty: 0.045
      body_rate_penalty: 0.00055
      action_smoothness_penalty: 0.0035
      vertical_speed_penalty: 0.0008
      thrust_saturation_penalty: 0.001
      max_progress_reward: 3.0
      max_centerline_progress: 2.0
      max_centerline_error: 6.0

    curriculum:
      enabled: false

    collapse_guard:
      enabled: true
      after_iter: 25
      patience: 2
      min_success_rate: 0.05
      max_gate_completion: 0.25
      skip_update: true

training:
  trainer_type: ppo_flightmare
  max_grad_norm: 0.5
  logging_steps: 1
  save_steps: 50
  save_total_limit: 100
  save_final: true
  save_optimizer_state: true
  best_steps: 1
  selection_metric: rollout_score
  rollout_score_weights:
    success_rate: 6.0
    mean_gate_completion: 1.5
    mean_speed_mps: 0.08
    mean_length: 0.0
    mean_reward: 0.0

  bf16: false
  output_dir: outputs/${run.name}

wandb:
  project: flightmare-ppo
  entity: andrewolvera
  run_name: ${run.name}
  tags: [flightmare, ppo, state-only, ctbr, v3, stage6, champion-lap, fixed-course, guarded-speed]
