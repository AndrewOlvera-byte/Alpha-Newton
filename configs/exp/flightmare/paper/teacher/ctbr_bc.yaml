# Teacher BC pretraining on REAL Flightmare dynamics — RACING plant (v5).
#
# Difference vs paper/ctbr_bc.yaml (v4):
#   - data_dir points at bc_v5, which was collected on the racing plant
#     (omega_max_body=[18,18,18]). This makes the BC (s, a) distribution
#     consistent with what the teacher PPO will execute, eliminating the
#     plant-gap distribution shift that crashed bridge teacher PPO at the
#     stage 1/2 boundary (run 6l8f21c1: KL exploded from 0.003 to 1e7 on
#     the first authority lift because BC v4 was a tame-plant policy).
#
# Action space and architecture are unchanged so this remains a drop-in
# checkpoint for the existing flightmare_actor PPO trainer.
#
# Prereqs:
#   docker compose exec alpha-newton bash scripts/flightmare_bc/collect_v5.sh
#
# Run:
#   docker compose exec alpha-newton python -m src.entrypoints.train_bc \
#     --exp flightmare/paper/teacher/ctbr_bc

run:
  name: paper_teacher_ctbr_bc_v5
  mode: bc
  seed: 0

data:
  type: flightmare_bc_state_v3
  data_dir: data/flightmare/bc_v5
  action_type: ctbr
  normalize_obs: true
  normalize_action: true
  action_normalization: bounds

robotics:
  architecture:
    type: flightmare_actor
    mode: bc
    action_type: ctbr

    fusion: swift
    proprio_core_dim: 9
    gate_dim: 24
    aux_dim: 3
    action_dim: 4
    use_vision: false
    include_prev_action: true

    proprio_hidden_dim: 128
    proprio_embed_dim: 128
    gate_hidden_dim: 128
    gate_embed_dim: 128
    trunk_hidden_dim: 768
    trunk_depth: 3
    dropout: 0.1

    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: true
    init_log_std: -1.0
    log_std_min: -5.0
    log_std_max: 0.5

    with_critic: false
    bc_loss_type: gnll
    action_clip: 1.2

training:
  trainer_type: bc_flow_matching_robosuite
  per_device_train_batch_size: 16384
  per_device_eval_batch_size: 16384
  gradient_accumulation_steps: 1
  learning_rate: 7.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 1500
  max_steps: 10000
  max_grad_norm: 5.0
  logging_steps: 50
  save_steps: 1000
  eval_steps: 250
  bf16: true
  fp8: false
  torch_compile: false
  # Dataset preloads into RAM (~1.1 GB for bc_v5: 6.3M samples * 44 floats).
  # With preload, __getitem__ is pure tensor index; the old 8-worker h5
  # fan-out becomes pure overhead. Benchmarked on this box:
  #   preload=False workers=8:  0.6 steps/s  (h5 random reads dominate)
  #   preload=True  workers=0:  7.8 steps/s
  #   preload=True  workers=2: 14.9 steps/s  (25x faster than original)
  # Two workers wins because the preloaded tensors share via mmap so worker
  # IPC is nearly free, and async fetch overlaps with GPU h2d copies.
  dataloader_num_workers: 2
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  selection_metric: eval_loss
  early_stopping_patience: 8
  output_dir: outputs/${run.name}

wandb:
  project: flightmare-bc
  entity: andrewolvera
  run_name: ${run.name}
  tags: [flightmare, bc, state-only, ctbr, v5, teacher, racing-plant]
