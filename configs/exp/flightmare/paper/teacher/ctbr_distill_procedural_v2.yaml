run:
  name: paper_teacher_ctbr_distill_procedural_v2
  mode: distill
  seed: 0
data:
  type: flightmare_bc_state_v3
  data_dir: outputs/${run.name}/round_000/aggregate
  action_type: ctbr
  normalize_obs: true
  normalize_action: true
  action_normalization: bounds
  preload: true
  confidence_floor: 0.3
robotics:
  architecture:
    type: flightmare_actor
    mode: bc
    action_type: ctbr
    fusion: swift
    proprio_core_dim: 9
    gate_dim: 24
    aux_dim: 3
    action_dim: 4
    use_vision: false
    include_prev_action: true
    proprio_hidden_dim: 128
    proprio_embed_dim: 128
    gate_hidden_dim: 128
    gate_embed_dim: 128
    trunk_hidden_dim: 768
    trunk_depth: 3
    dropout: 0.05
    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: true
    init_log_std: -1.0
    log_std_min: -5.0
    log_std_max: 0.5
    with_critic: false
    bc_loss_type: huber
    bc_huber_delta: 0.25
    expert_std_loss_weight: 0.02
    action_clip: 1.2
training:
  trainer_type: flightmare_dagger_distill
  output_dir: outputs/${run.name}
  selection_metric: flightmare_rollout_score
  per_device_train_batch_size: 16384
  per_device_eval_batch_size: 16384
  gradient_accumulation_steps: 1
  learning_rate: 0.0005
  weight_decay: 0.0001
  warmup_steps: 500
  max_steps: 3000
  max_grad_norm: 5.0
  logging_steps: 50
  save_steps: 1000
  eval_steps: 500
  bf16: true
  fp8: false
  torch_compile: false
  dataloader_num_workers: 2
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  early_stopping_patience: 8
  save_total_limit: 4
  sample_kind_balancing:
    enabled: false
    _note: Aggressive target_mix (dagger 0.65) overfits the sparse early dagger samples
      and collapses the policy each round; rely on keep-all aggregation + clean_expert_fraction
      beta-decay to grow dagger coverage naturally.
  rollout_eval:
    enabled: true
    type: flightmare
    every_steps: 1000
    episodes: 24
    seed: 23
    backend: flightgym
    fail_on_fallback: true
    max_steps: 2200
    max_body_rate: 18.0
    max_waypoint_speed: 15.0
    max_world_radius: 350.0
    min_z: -0.25
    gate_vehicle_radius: 0.2
    terminate_on_gate_miss: true
    score_weights:
      success_rate: 4.0
      mean_gate_completion: 10.0
      mean_speed_mps: 0.04
      gate_miss_rate: -2.0
      thrust_saturation_frac: -0.6
      body_rate_saturation_frac: -0.8
      mean_final_distance_to_gate_m: -0.03
distill:
  rounds: 6
  episodes_per_round: 128
  bootstrap_episodes: 256
  val_frac: 0.1
  seed: 0
  collection_mode: flightmare
  collection_config: configs/flightmare_bc/ctbr_v7_geom.yaml
  skip_controller_eval: false
  bc_loss_schedule:
  - huber
  - huber
  - gnll
  - gnll
  - gnll
  - gnll
  clean_expert_fraction_schedule:
  - 0.5
  - 0.35
  - 0.25
  - 0.15
  - 0.12
  - 0.1
  synthetic_recovery_fraction_schedule:
  - 0.3
  - 0.25
  - 0.2
  - 0.18
  - 0.15
  - 0.15
  aggregate:
    max_rounds_kept: all
  expert:
    type: classical_hybrid
    primary: geometric_minjerk
    fallback: null
  student:
    init_checkpoint: null
  inner_training:
    trainer_type: bc_flow_matching_robosuite
    max_steps: 3000
    warmup_steps: 500
    save_steps: 1000
    eval_steps: 500
    save_total_limit: 4
wandb:
  project: flightmare-bc
  entity: andrewolvera
  run_name: ${run.name}
  tags:
  - flightmare
  - distill
  - dagger
  - ctbr
  - geometric
  - procedural
  - teacher
  - state-only
