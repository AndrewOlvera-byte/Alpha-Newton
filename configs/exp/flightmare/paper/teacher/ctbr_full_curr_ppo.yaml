# Teacher CTBR PPO — unified curriculum on a racing-drone plant.
#
# This is the single teacher run distillations inherit from. It learns the
# Swift-scale Split-S course from scratch (BC warm-start) on a plant that
# matches a real 5" racing quad (TWR 6.0g, body-rate ceiling 18 rad/s) and
# generalizes to perturbed layouts so future students can be warmed up onto
# procedural courses.
#
# Reward: flightmare_racing_v3 throughout. The v4_speed shaped reward did
# not beat letting the base reward run longer after full-course mastery, so
# every stage here uses v3 with stage-tuned args.
#
# Curriculum design (mirrors the v5 ablation that worked, then extends):
#
#   1) reference-state single-gate starts across all 7 gates, fixed layout
#   2) two-gate transitions, fixed layout
#   3) three-gate windows, fixed layout
#   4) five-gate windows — bounds widen here so the policy can express the
#      full racing-drone envelope (thrust [0, 1], body rates ±10 rad/s)
#   5) partial remaining-course starts, light layout noise
#   6) full course from course_start, light layout noise
#   7) full course, moderate noise + start-distance jitter (generality lock)
#   8) full course, longer iter window for speed/consolidation under base
#      reward (no shaped-speed reward); strongest layout perturbation so the
#      teacher is robust to procedurally generated student courses
#
# Start variability ramps up by stage:
#   stages 1–3: tight reference_speed_mps + narrow start_offset_range
#   stages 4–5: wider start_offset_range, broader start_gate_choices
#   stages 6–8: full course_start, with progressively larger gate noise
#
# Layout noise ramps:
#   stage 1–3: 0.00 m / 0.00 rad
#   stage 4:   0.05 m / 0.01 rad
#   stage 5:   0.10 m / 0.02 rad
#   stage 6:   0.15 m / 0.03 rad
#   stage 7:   0.25 m / 0.05 rad
#   stage 8:   0.35 m / 0.06 rad
# Per-gate rejection sampling inside swift_v4 ensures noisy gates never
# overlap (see scripts/flightmare_bc/collect.py:_swift_v4_gate_course).
#
# Run:
#   docker compose exec alpha-newton python -m src.entrypoints.train_ppo \
#     --exp flightmare/paper/teacher/ctbr_full_curr_ppo

run:
  name: paper_teacher_ctbr_full_curr_ppo_v1
  mode: ppo
  seed: 0

data:
  type: flightmare_ppo_state
  data_dir: data/flightmare/bc_v4
  action_type: ctbr
  obs_schema: v3
  normalize_state: true
  normalize_action: true
  action_normalization: bounds

robotics:
  architecture:
    type: flightmare_actor
    mode: ppo
    action_type: ctbr
    bc_checkpoint: outputs/paper_ctbr_bc_v4/best/model.pt

    fusion: swift
    proprio_core_dim: 9
    gate_dim: 24
    aux_dim: 3
    action_dim: 4
    use_vision: false
    include_prev_action: true

    proprio_hidden_dim: 128
    proprio_embed_dim: 128
    gate_hidden_dim: 128
    gate_embed_dim: 128
    trunk_hidden_dim: 768
    trunk_depth: 3
    dropout: 0.05

    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: false
    init_log_std: -2.0
    log_std_min: -4.0
    log_std_max: -1.1
    with_critic: true
    critic_hidden_dim: 256
    critic_depth: 2
    bc_loss_type: gnll
    action_clip: 1.0

  ppo:
    bc_checkpoint: outputs/paper_ctbr_bc_v4/best/model.pt
    action_type: ctbr

    obs_schema: v3
    backend: flightgym
    render: false
    scene: industrial

    # PPO core. n_envs/n_steps chosen to keep ~8k batch with 4 epochs and
    # 2048 minibatch -> 16 updates per iter; enough for steady BC-anchored
    # actor moves under target_kl=0.015 without runaway updates.
    n_envs: 16
    n_workers: 16
    n_steps: 512
    ppo_epochs: 4
    minibatch_size: 2048
    clip_eps: 0.05
    vf_coeff: 0.5
    ent_coeff: 0.001
    gamma: 0.997
    gae_lambda: 0.95
    max_iterations: 45000
    actor_lr: 4.0e-6
    critic_lr: 1.5e-4
    target_kl: 0.015

    control_hz: 100.0
    horizon: 2500

    course_mode: swift_v4
    num_gates: 7
    gate_size: 1.6
    gate_approach_m: 3.0
    z_min: 1.0
    fixed_gate_pos_noise: 0.00
    fixed_gate_yaw_noise: 0.00
    random_start_gate: false
    reset_mode: reference_state
    start_offset_m: 3.0
    start_offset_range: [2.0, 4.0]
    reference_speed_mps: 4.0
    goal_mode: pass_gate_i

    gate_vehicle_radius: 0.20
    max_world_radius: 350.0
    min_z: -0.25
    terminate_on_gate_miss: true
    terminate_on_crash: true

    max_body_rate: 8.0
    max_collective_thrust_g: 6.0
    action_clip: 1.0

    # Racing-drone plant. omega_max=18 rad/s is the key change vs. stock
    # Flightmare (6 rad/s). Mass/inertia/motor params match Flightmare's
    # default 0.73 kg X-quad so BC priors transfer cleanly.
    plant:
      mass: 0.73
      arm_length: 0.17
      inertia: [0.0025, 0.0021, 0.0043]
      k_thrust: 1.91e-6
      k_torque: 2.6e-7
      motor_omega_min: 150.0
      motor_omega_max: 3000.0
      motor_tau: 0.0001
      thrust_map: [1.3298253500372892e-06, 0.0038360810526746033, -1.7689986848125325]
      kappa: 0.016
      omega_max_body: [18.0, 18.0, 18.0]

    reward_fn: flightmare_racing_v3
    reward_kwargs:
      gate_normal_progress_scale: 6.0
      segment_progress_scale: 1.5
      centerline_progress_scale: 3.0
      centerline_error_penalty: 0.04
      aperture_near_penalty: 0.75
      aperture_near_m: 4.0
      velocity_alignment_scale: 0.06
      body_alignment_scale: 0.04
      gate_pass_bonus: 28.0
      segment_completion_bonus: 8.0
      completion_bonus: 180.0
      gate_miss_penalty: 80.0
      crash_penalty: 90.0
      no_progress_penalty: 0.08
      backward_progress_penalty: 2.0
      min_forward_velocity_mps: 0.75
      stall_grace_steps: 25
      time_penalty: 0.015
      body_rate_penalty: 0.0007
      action_smoothness_penalty: 0.006
      vertical_speed_penalty: 0.001
      max_progress_reward: 3.0
      max_centerline_progress: 2.0
      max_centerline_error: 6.0

    curriculum:
      enabled: true
      advance_metric: null
      advance_threshold: 1.0
      stages:
        # ---------------------------------------------------------------
        # Stage 1: reference-state single-gate starts. Build per-gate
        # competence on the canonical fixed Split-S layout. Wider
        # start_offset_range than the v4 baseline so the policy already
        # gets distance variability at this stage.
        # ---------------------------------------------------------------
        - name: stage1_single_gate
          until_iter: 2000
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.0
          fixed_gate_yaw_noise: 0.0
          reset_mode: reference_state
          start_gate_choices: [0, 1, 2, 3, 4, 5, 6]
          start_offset_range: [1.5, 5.0]
          goal_mode: pass_gate_i
          horizon: 700
          ent_coeff_override: 0.002

        # ---------------------------------------------------------------
        # Stage 2: two-gate transitions. Slightly wider start window than
        # stage 1; longer horizon to allow the full segment.
        # ---------------------------------------------------------------
        - name: stage2_two_gate_transitions
          until_iter: 6000
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.0
          fixed_gate_yaw_noise: 0.0
          reset_mode: reference_state
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [1.5, 5.0]
          goal_mode: gate_i_to_i+1
          horizon: 1000
          ent_coeff_override: 0.0015

        # ---------------------------------------------------------------
        # Stage 3: three-gate windows. Still fixed layout — segment_window
        # reset spawns the drone closer to the actual segment entry, so
        # this is the first stage with non-trivial multi-gate planning.
        # ---------------------------------------------------------------
        - name: stage3_three_gate_windows
          until_iter: 11000
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.0
          fixed_gate_yaw_noise: 0.0
          reset_mode: segment_window
          start_gate_choices: [0, 1, 2, 3, 4]
          start_offset_range: [1.5, 5.0]
          goal_mode: gate_i_to_i+2
          horizon: 1400
          ent_coeff_override: 0.0012

        # ---------------------------------------------------------------
        # Stage 4: five-gate windows. Bounds widen here so the policy can
        # express full racing capability. Small layout noise introduces
        # the first generalization signal. max_body_rate raised to 12.
        # ---------------------------------------------------------------
        - name: stage4_five_gate_windows
          until_iter: 17000
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.05
          fixed_gate_yaw_noise: 0.01
          reset_mode: segment_window
          start_gate_choices: [0, 1, 2]
          start_offset_range: [1.5, 5.0]
          goal_gate_span: 5
          goal_mode: finish_remaining_course
          horizon: 2100
          ent_coeff_override: 0.001
          max_body_rate: 12.0
          action_bounds_override:
            ctbr:
              low: [0.0, -10.0, -10.0, -3.0]
              high: [1.0,  10.0,  10.0,  3.0]

        # ---------------------------------------------------------------
        # Stage 5: partial remaining-course starts. Layout noise increases
        # so the policy starts seeing meaningful per-episode perturbations.
        # ---------------------------------------------------------------
        - name: stage5_partial_remaining_course
          until_iter: 23000
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.10
          fixed_gate_yaw_noise: 0.02
          reset_mode: reference_state
          start_gate_choices: [0, 1, 2, 3]
          start_offset_range: [1.5, 5.0]
          goal_mode: finish_remaining_course
          horizon: 2500
          ent_coeff_override: 0.0009
          max_body_rate: 12.0
          action_bounds_override:
            ctbr:
              low: [0.0, -10.0, -10.0, -3.0]
              high: [1.0,  10.0,  10.0,  3.0]

        # ---------------------------------------------------------------
        # Stage 6: full course from course_start, light noise. First stage
        # where the policy is solely judged on full-course completion.
        # ---------------------------------------------------------------
        - name: stage6_full_course_reliability
          until_iter: 29000
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.15
          fixed_gate_yaw_noise: 0.03
          reset_mode: course_start
          start_gate_choices: null
          start_offset_range: null
          goal_mode: finish_remaining_course
          horizon: 2800
          ent_coeff_override: 0.0007
          max_body_rate: 12.0
          action_bounds_override:
            ctbr:
              low: [0.0, -10.0, -10.0, -3.0]
              high: [1.0,  10.0,  10.0,  3.0]

        # ---------------------------------------------------------------
        # Stage 7: full course, moderate layout perturbation + tighter
        # reward miss/crash penalties. This is the generality lock — the
        # teacher cannot rely on a memorized fixed-layout trajectory here.
        # ---------------------------------------------------------------
        - name: stage7_full_course_generality
          until_iter: 36000
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.25
          fixed_gate_yaw_noise: 0.05
          reset_mode: course_start
          start_gate_choices: null
          start_offset_range: null
          goal_mode: finish_remaining_course
          horizon: 2600
          ent_coeff_override: 0.0006
          max_body_rate: 14.0
          action_bounds_override:
            ctbr:
              low: [0.0, -12.0, -12.0, -3.0]
              high: [1.0,  12.0,  12.0,  3.0]
          reward_kwargs:
            gate_miss_penalty: 100.0
            crash_penalty: 110.0
            no_progress_penalty: 0.10
            min_forward_velocity_mps: 1.0
            time_penalty: 0.02

        # ---------------------------------------------------------------
        # Stage 8: long final phase. Strongest layout perturbation, lowest
        # entropy, widest bounds (matches stage 7) — the "let the base
        # reward cook" phase. Under v3, sustained training here is what
        # produced speed gains in the v5 ablation without the v4_speed
        # shaped reward. Iter budget intentionally large so improvements
        # are gradual but compound.
        # ---------------------------------------------------------------
        - name: stage8_full_course_speed_consolidation
          until_iter: 45000
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.35
          fixed_gate_yaw_noise: 0.06
          reset_mode: course_start
          start_gate_choices: null
          start_offset_range: null
          goal_mode: finish_remaining_course
          horizon: 2400
          ent_coeff_override: 0.0004
          max_body_rate: 15.0
          action_bounds_override:
            ctbr:
              low: [0.0, -12.0, -12.0, -3.0]
              high: [1.0,  12.0,  12.0,  3.0]
          reward_kwargs:
            # Slight tightening over stage 7 — the consolidation phase is
            # where residual failure modes get closed and reliability
            # under noise gets locked in. min_forward_velocity_mps nudges
            # the policy faster without a separate shaped speed term.
            gate_miss_penalty: 110.0
            crash_penalty: 120.0
            no_progress_penalty: 0.10
            min_forward_velocity_mps: 1.5
            time_penalty: 0.025
            body_rate_penalty: 0.0005
            action_smoothness_penalty: 0.005

training:
  trainer_type: ppo_flightmare
  max_grad_norm: 0.5
  logging_steps: 1
  save_steps: 100
  save_total_limit: 80
  save_final: true
  save_optimizer_state: true
  best_steps: 1
  selection_metric: rollout_score
  # Stage-aware scoring. stage_index*4 means each curriculum advance adds 4
  # points to the score baseline — large enough that any new-stage rollout
  # with success_rate ≥ 0.5 beats a saturated success_rate=1.0 win on the
  # prior stage (which sits at ~1.0 + 0.25*7 ≈ 2.75 within-stage max).
  # Speed and gate completion provide fine-grained tiebreak inside a stage.
  rollout_score_weights:
    success_rate: 1.0
    mean_gate_completion: 0.25
    mean_speed_mps: 0.05
    mean_reward: 0.0
    stage_index: 4.0

  bf16: true
  output_dir: outputs/${run.name}

wandb:
  project: flightmare-ppo
  entity: andrewolvera
  run_name: ${run.name}
  tags: [flightmare, ppo, state-only, ctbr, v1, teacher, full-curriculum, racing-plant, base-reward]
