# Teacher CTBR PPO v10 - broad early replay, gradual align tighten, protected bridge.
#
# v9 showed a useful loose all-gate skill near iter 1322, then collapsed when
# s4 tightened post-pass survival, centerline error, speed, body-rate, and
# signed-distance constraints at once. It also never learned the course-start
# entry distribution that eval_flightmare.py uses.
#
# v10 changes the curriculum shape:
#   1. Start with all-gate pass_gate_i replay, including gate 6, so every gate
#      aperture is visited immediately.
#   2. Move to pass_gate_i_align_next on all transition gates from the start,
#      with small lateral/vertical/yaw/speed reference-start jitter.
#   3. Tighten post-pass constraints in small steps and never jump directly to
#      the old v9 s4 target.
#   4. Switch to gate_i_to_i+1 with a critic warmup and partial actor unfreeze.
#   5. Add course-start bridge stages before asking eval_flightmare.py to work.
#
# Run:
#   docker compose exec alpha-newton python -m src.entrypoints.train_ppo \
#     --exp flightmare/paper/teacher/ctbr_stage12_v10_ppo

run:
  name: paper_teacher_ctbr_stage12_v10_ppo
  mode: ppo
  seed: 0

data:
  type: flightmare_ppo_state
  data_dir: data/flightmare/bc_v5
  action_type: ctbr
  obs_schema: v3
  normalize_state: true
  normalize_action: true
  action_normalization: bounds

robotics:
  architecture:
    type: flightmare_actor
    mode: ppo
    action_type: ctbr
    bc_checkpoint: outputs/paper_teacher_ctbr_bc_v5/best/model.pt

    fusion: swift
    proprio_core_dim: 9
    gate_dim: 24
    aux_dim: 3
    action_dim: 4
    use_vision: false
    include_prev_action: true

    proprio_hidden_dim: 128
    proprio_embed_dim: 128
    gate_hidden_dim: 128
    gate_embed_dim: 128
    trunk_hidden_dim: 768
    trunk_depth: 3
    dropout: 0.05

    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: false
    init_log_std: -2.15
    log_std_min: -4.0
    log_std_max: -1.35
    with_critic: true
    critic_hidden_dim: 256
    critic_depth: 2
    bc_loss_type: gnll
    action_clip: 1.5
    squash_actions: false

  ppo:
    bc_checkpoint: outputs/paper_teacher_ctbr_bc_v5/best/model.pt
    action_type: ctbr

    obs_schema: v3
    backend: flightgym
    render: false
    scene: industrial

    n_envs: 32
    n_workers: 8
    n_steps: 768
    ppo_epochs: 3
    minibatch_size: 4096
    clip_eps: 0.08
    vf_coeff: 0.5
    ent_coeff: 0.0012
    gamma: 0.997
    gae_lambda: 0.95
    max_iterations: 9000
    actor_lr: 1.8e-6
    critic_lr: 1.0e-4
    target_kl: 0.012

    control_hz: 100.0
    horizon: 1000

    course_mode: swift_v4
    num_gates: 7
    gate_size: 1.6
    gate_approach_m: 3.0
    z_min: 1.0
    fixed_gate_pos_noise: 0.00
    fixed_gate_yaw_noise: 0.00
    random_start_gate: false
    reset_mode: reference_state
    start_offset_m: 3.0
    start_offset_range: [2.0, 4.0]
    start_lateral_range_m: [0.0, 0.0]
    start_vertical_range_m: [0.0, 0.0]
    start_yaw_noise_rad: 0.0
    start_speed_noise_mps: 0.0
    reference_speed_mps: 3.0
    goal_mode: pass_gate_i

    gate_vehicle_radius: 0.20
    max_world_radius: 350.0
    min_z: -0.25
    terminate_on_gate_miss: true
    terminate_on_crash: true

    max_body_rate: 8.0
    max_collective_thrust_g: 5.5
    action_clip: 1.5

    plant:
      mass: 0.73
      arm_length: 0.17
      inertia: [0.0025, 0.0021, 0.0043]
      k_thrust: 1.91e-6
      k_torque: 2.6e-7
      motor_omega_min: 150.0
      motor_omega_max: 3000.0
      motor_tau: 0.0001
      thrust_map: [1.3298253500372892e-06, 0.0038360810526746033, -1.7689986848125325]
      kappa: 0.016
      omega_max_body: [18.0, 18.0, 18.0]

    reward_fn: flightmare_racing_v3
    reward_kwargs:
      gate_normal_progress_scale: 6.0
      segment_progress_scale: 1.5
      centerline_progress_scale: 3.6
      centerline_error_penalty: 0.045
      aperture_near_penalty: 0.90
      aperture_near_m: 4.5
      velocity_alignment_scale: 0.05
      body_alignment_scale: 0.04
      gate_pass_bonus: 26.0
      segment_completion_bonus: 7.0
      completion_bonus: 170.0
      gate_miss_penalty: 95.0
      crash_penalty: 110.0
      no_progress_penalty: 0.10
      backward_progress_penalty: 2.0
      min_forward_velocity_mps: 0.75
      stall_grace_steps: 25
      time_penalty: 0.010
      body_rate_penalty: 0.0010
      action_smoothness_penalty: 0.010
      vertical_speed_penalty: 0.0012
      speed_limit_mps: 7.5
      speed_limit_penalty: 0.08
      max_progress_reward: 3.0
      max_centerline_progress: 2.0
      max_centerline_error: 6.0

    collapse_guard:
      enabled: false

    curriculum:
      enabled: true
      advance_metric: null
      advance_threshold: 1.0
      stages:
        # PHASE 0 - immediate broad aperture replay. This restores the old
        # curriculum's key advantage: every gate is sampled from the beginning.
        - name: s1_pass_all_gates_replay
          until_iter: 600
          start_gate_choices: [0, 1, 2, 3, 4, 5, 6]
          start_offset_range: [2.0, 4.2]
          start_lateral_range_m: [-0.20, 0.20]
          start_vertical_range_m: [-0.15, 0.15]
          start_yaw_noise_rad: 0.08
          start_speed_noise_mps: 0.20
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i
          horizon: 650
          max_collective_thrust_g: 5.3
          max_body_rate: 8.0
          ent_coeff_override: 0.0020
          reward_kwargs:
            centerline_progress_scale: 3.4
            centerline_error_penalty: 0.040
            time_penalty: 0.008
            body_rate_penalty: 0.0012
            action_smoothness_penalty: 0.010

        # PHASE 1 - all transition gates, loose aligned exits, with modest
        # start jitter. Gate 6 is omitted because there is no next-gate exit.
        - name: s2_align_all_loose
          until_iter: 1400
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.25, 0.25]
          start_vertical_range_m: [-0.20, 0.20]
          start_yaw_noise_rad: 0.10
          start_speed_noise_mps: 0.25
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i_align_next
          post_pass_success_steps: 12
          post_pass_max_center_error_norm: 3.2
          post_pass_min_gate_signed_distance_m: -10.0
          post_pass_max_speed_mps: 9.0
          post_pass_max_body_rate: 9.0
          horizon: 780
          max_collective_thrust_g: 5.4
          max_body_rate: 8.0
          ent_coeff_override: 0.0018
          reward_kwargs:
            centerline_progress_scale: 4.1
            centerline_error_penalty: 0.050
            speed_limit_mps: 8.0

        - name: s3_align_all_stabilize
          until_iter: 2300
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.30, 0.30]
          start_vertical_range_m: [-0.25, 0.25]
          start_yaw_noise_rad: 0.12
          start_speed_noise_mps: 0.25
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i_align_next
          post_pass_success_steps: 25
          post_pass_max_center_error_norm: 2.8
          post_pass_min_gate_signed_distance_m: -9.5
          post_pass_max_speed_mps: 8.8
          post_pass_max_body_rate: 8.8
          horizon: 850
          max_collective_thrust_g: 5.4
          max_body_rate: 8.0
          ent_coeff_override: 0.0015
          reward_kwargs:
            centerline_progress_scale: 4.4
            centerline_error_penalty: 0.055
            speed_limit_mps: 7.8

        - name: s4_align_exit_survival
          until_iter: 3200
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.35, 0.35]
          start_vertical_range_m: [-0.30, 0.30]
          start_yaw_noise_rad: 0.14
          start_speed_noise_mps: 0.30
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i_align_next
          post_pass_success_steps: 35
          post_pass_max_center_error_norm: 2.5
          post_pass_min_gate_signed_distance_m: -9.0
          post_pass_max_speed_mps: 8.5
          post_pass_max_body_rate: 8.5
          horizon: 900
          max_collective_thrust_g: 5.35
          max_body_rate: 8.0
          ent_coeff_override: 0.0013
          reward_kwargs:
            centerline_progress_scale: 4.6
            centerline_error_penalty: 0.060
            speed_limit_mps: 7.8

        - name: s5_align_moderate_tighten
          until_iter: 4100
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.35, 0.35]
          start_vertical_range_m: [-0.30, 0.30]
          start_yaw_noise_rad: 0.14
          start_speed_noise_mps: 0.30
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i_align_next
          post_pass_success_steps: 40
          post_pass_max_center_error_norm: 2.25
          post_pass_min_gate_signed_distance_m: -8.5
          post_pass_max_speed_mps: 8.2
          post_pass_max_body_rate: 8.2
          horizon: 950
          max_collective_thrust_g: 5.35
          max_body_rate: 8.0
          ent_coeff_override: 0.0011
          reward_kwargs:
            centerline_progress_scale: 4.7
            centerline_error_penalty: 0.065
            speed_limit_mps: 7.6

        - name: s6_align_final_hold
          until_iter: 5000
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.35, 0.35]
          start_vertical_range_m: [-0.30, 0.30]
          start_yaw_noise_rad: 0.14
          start_speed_noise_mps: 0.30
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i_align_next
          post_pass_success_steps: 45
          post_pass_max_center_error_norm: 2.0
          post_pass_min_gate_signed_distance_m: -8.0
          post_pass_max_speed_mps: 8.0
          post_pass_max_body_rate: 8.0
          horizon: 1000
          max_collective_thrust_g: 5.35
          max_body_rate: 8.0
          ent_coeff_override: 0.0010
          reward_kwargs:
            centerline_progress_scale: 4.7
            centerline_error_penalty: 0.065
            speed_limit_mps: 7.5

        # PHASE 2 - same gate-window distribution, but non-terminal chaining.
        # Actor LR is throttled while the critic refits the changed bootstrap.
        - name: s7_chain_critic_warmup_frozen
          until_iter: 5200
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.30, 0.30]
          start_vertical_range_m: [-0.25, 0.25]
          start_yaw_noise_rad: 0.12
          start_speed_noise_mps: 0.25
          reference_speed_mps: 3.0
          goal_mode: gate_i_to_i+1
          horizon: 1100
          max_collective_thrust_g: 5.35
          max_body_rate: 8.0
          ent_coeff_override: 0.0010
          actor_lr_override: 1.0e-7
          reward_kwargs:
            centerline_progress_scale: 4.7
            centerline_error_penalty: 0.060
            speed_limit_mps: 7.5

        - name: s8_chain_partial_unfreeze
          until_iter: 5600
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.30, 0.30]
          start_vertical_range_m: [-0.25, 0.25]
          start_yaw_noise_rad: 0.12
          start_speed_noise_mps: 0.25
          reference_speed_mps: 3.0
          goal_mode: gate_i_to_i+1
          horizon: 1100
          max_collective_thrust_g: 5.35
          max_body_rate: 8.0
          ent_coeff_override: 0.0010
          actor_lr_override: 6.0e-7
          reward_kwargs:
            centerline_progress_scale: 4.6
            centerline_error_penalty: 0.058
            speed_limit_mps: 7.5

        - name: s9_chain_controlled_windows
          until_iter: 6400
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.35, 0.35]
          start_vertical_range_m: [-0.30, 0.30]
          start_yaw_noise_rad: 0.14
          start_speed_noise_mps: 0.30
          reference_speed_mps: 3.0
          goal_mode: gate_i_to_i+1
          horizon: 1100
          max_collective_thrust_g: 5.35
          max_body_rate: 8.0
          ent_coeff_override: 0.00095
          reward_kwargs:
            centerline_progress_scale: 4.5
            centerline_error_penalty: 0.055
            speed_limit_mps: 7.5

        - name: s10_chain_raise_speed
          until_iter: 7100
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.35, 0.35]
          start_vertical_range_m: [-0.30, 0.30]
          start_yaw_noise_rad: 0.14
          start_speed_noise_mps: 0.35
          reference_speed_mps: 3.5
          goal_mode: gate_i_to_i+1
          horizon: 1100
          max_collective_thrust_g: 5.45
          max_body_rate: 8.0
          ent_coeff_override: 0.0009
          reward_kwargs:
            centerline_progress_scale: 4.4
            centerline_error_penalty: 0.052
            time_penalty: 0.011
            body_rate_penalty: 0.0009
            speed_limit_mps: 8.0

        # PHASE 3 - bridge the eval_flightmare.py distribution. These stages
        # start at the course start, first for two gates, then three, then full.
        - name: s11_course_start_two_gate_bridge
          until_iter: 7700
          reset_mode: course_start
          start_gate_choices: [0]
          goal_mode: gate_i_to_i+1
          horizon: 1300
          max_collective_thrust_g: 5.45
          max_body_rate: 8.0
          ent_coeff_override: 0.0010
          actor_lr_override: 9.0e-7
          reward_kwargs:
            centerline_progress_scale: 4.3
            centerline_error_penalty: 0.050
            time_penalty: 0.010
            speed_limit_mps: 8.0

        - name: s12_course_start_three_gate_bridge
          until_iter: 8350
          reset_mode: course_start
          start_gate_choices: [0]
          goal_mode: gate_i_to_i+2
          horizon: 1500
          max_collective_thrust_g: 5.5
          max_body_rate: 8.0
          ent_coeff_override: 0.0009
          reward_kwargs:
            centerline_progress_scale: 4.2
            centerline_error_penalty: 0.048
            time_penalty: 0.011
            speed_limit_mps: 8.5

        - name: s13_course_start_full_entry
          until_iter: 9000
          reset_mode: course_start
          start_gate_choices: [0]
          goal_mode: finish_remaining_course
          horizon: 1800
          max_collective_thrust_g: 5.5
          max_body_rate: 8.0
          ent_coeff_override: 0.0008
          reward_kwargs:
            centerline_progress_scale: 4.0
            centerline_error_penalty: 0.045
            time_penalty: 0.012
            body_rate_penalty: 0.0008
            speed_limit_mps: 9.0

training:
  trainer_type: ppo_flightmare
  max_grad_norm: 0.5
  logging_steps: 1
  save_steps: 50
  save_total_limit: 100
  save_final: true
  save_optimizer_state: true
  best_steps: 1
  selection_metric: rollout_score
  rollout_score_weights:
    success_rate: 1.0
    mean_goal_completion: 0.40
    mean_gate_completion: 0.05
    mean_speed_mps: 0.0
    mean_reward: 0.0
    mean_length: 0.0
    stage_index: 0.08

  bf16: false
  output_dir: outputs/${run.name}

wandb:
  project: flightmare-ppo
  entity: andrewolvera
  run_name: ${run.name}
  tags: [flightmare, ppo, state-only, ctbr, teacher, v10, racing-plant, broad-starts, gradual-align, course-start-bridge]
