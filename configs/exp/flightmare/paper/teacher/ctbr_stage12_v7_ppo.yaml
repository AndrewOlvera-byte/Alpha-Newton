# Teacher CTBR PPO v7 - BC restart with bounded PPO actions and a cleaned
# stage-1 -> stage-2 bridge for the racing plant.
#
# Key differences from v6:
#   - Starts from the v5 CTBR BC checkpoint, not a PPO resume checkpoint.
#   - Enables tanh-squashed PPO actions so the sampled action, env action, and
#     PPO log-prob live on the same bounded support.
#   - Uses stage-relative goal_completion in rollout selection/logging.
#   - Uses post-gate survival stages that do not reward extra gates after the
#     target pass, with generous speed/rate sanity checks to reject ballistic
#     survival.
#   - Removes speed from best-checkpoint selection. Speed should emerge after
#     controlled two-gate success, not be selected during the bridge.
#
# Run:
#   docker compose exec alpha-newton python -m src.entrypoints.train_ppo \
#     --exp flightmare/paper/teacher/ctbr_stage12_v7_ppo

run:
  name: paper_teacher_ctbr_stage12_v7_ppo
  mode: ppo
  seed: 0

data:
  type: flightmare_ppo_state
  data_dir: data/flightmare/bc_v5
  action_type: ctbr
  obs_schema: v3
  normalize_state: true
  normalize_action: true
  action_normalization: bounds

robotics:
  architecture:
    type: flightmare_actor
    mode: ppo
    action_type: ctbr
    bc_checkpoint: outputs/paper_teacher_ctbr_bc_v5/best/model.pt

    fusion: swift
    proprio_core_dim: 9
    gate_dim: 24
    aux_dim: 3
    action_dim: 4
    use_vision: false
    include_prev_action: true

    proprio_hidden_dim: 128
    proprio_embed_dim: 128
    gate_hidden_dim: 128
    gate_embed_dim: 128
    trunk_hidden_dim: 768
    trunk_depth: 3
    dropout: 0.05

    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: false
    init_log_std: -2.6
    log_std_min: -4.2
    log_std_max: -1.8
    with_critic: true
    critic_hidden_dim: 256
    critic_depth: 2
    bc_loss_type: gnll
    action_clip: 1.0
    squash_actions: true

  ppo:
    bc_checkpoint: outputs/paper_teacher_ctbr_bc_v5/best/model.pt
    action_type: ctbr

    obs_schema: v3
    backend: flightgym
    render: false
    scene: industrial

    # 32x768 keeps the fast packed Flightmare setup while shortening update
    # latency relative to v6. The lower actor LR and tighter KL are matched to
    # this 24576-sample batch and the reactive racing plant.
    n_envs: 32
    n_workers: 8
    n_steps: 768
    ppo_epochs: 3
    minibatch_size: 4096
    clip_eps: 0.04
    vf_coeff: 0.5
    ent_coeff: 0.0010
    gamma: 0.997
    gae_lambda: 0.95
    max_iterations: 5000
    actor_lr: 2.5e-6
    critic_lr: 1.0e-4
    target_kl: 0.008

    control_hz: 100.0
    horizon: 1200

    course_mode: swift_v4
    num_gates: 7
    gate_size: 1.6
    gate_approach_m: 3.0
    z_min: 1.0
    fixed_gate_pos_noise: 0.00
    fixed_gate_yaw_noise: 0.00
    random_start_gate: false
    reset_mode: reference_state
    start_offset_m: 3.0
    start_offset_range: [2.0, 4.0]
    reference_speed_mps: 3.0
    goal_mode: pass_gate_i

    gate_vehicle_radius: 0.20
    max_world_radius: 350.0
    min_z: -0.25
    terminate_on_gate_miss: true
    terminate_on_crash: true

    max_body_rate: 8.0
    max_collective_thrust_g: 5.5
    action_clip: 1.0

    plant:
      mass: 0.73
      arm_length: 0.17
      inertia: [0.0025, 0.0021, 0.0043]
      k_thrust: 1.91e-6
      k_torque: 2.6e-7
      motor_omega_min: 150.0
      motor_omega_max: 3000.0
      motor_tau: 0.0001
      thrust_map: [1.3298253500372892e-06, 0.0038360810526746033, -1.7689986848125325]
      kappa: 0.016
      omega_max_body: [18.0, 18.0, 18.0]

    reward_fn: flightmare_racing_v3
    reward_kwargs:
      gate_normal_progress_scale: 6.0
      segment_progress_scale: 1.5
      centerline_progress_scale: 3.0
      centerline_error_penalty: 0.04
      aperture_near_penalty: 0.75
      aperture_near_m: 4.0
      velocity_alignment_scale: 0.06
      body_alignment_scale: 0.04
      gate_pass_bonus: 28.0
      segment_completion_bonus: 8.0
      completion_bonus: 180.0
      gate_miss_penalty: 80.0
      crash_penalty: 90.0
      no_progress_penalty: 0.08
      backward_progress_penalty: 2.0
      min_forward_velocity_mps: 0.75
      stall_grace_steps: 25
      time_penalty: 0.012
      body_rate_penalty: 0.0008
      action_smoothness_penalty: 0.008
      vertical_speed_penalty: 0.001
      max_progress_reward: 3.0
      max_centerline_progress: 2.0
      max_centerline_error: 6.0

    collapse_guard:
      enabled: false

    curriculum:
      enabled: true
      advance_metric: null
      advance_threshold: 1.0
      stages:
        - name: stage1a_single_gate_tame_bc_anchor
          until_iter: 250
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.0
          fixed_gate_yaw_noise: 0.0
          reset_mode: reference_state
          start_gate_choices: [0, 1, 2, 3, 4, 5, 6]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i
          horizon: 650
          max_collective_thrust_g: 4.5
          max_body_rate: 6.0
          ent_coeff_override: 0.0016
          reward_kwargs:
            time_penalty: 0.008
            body_rate_penalty: 0.0012
            action_smoothness_penalty: 0.010

        - name: stage1b_single_gate_full_authority
          until_iter: 650
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.0
          fixed_gate_yaw_noise: 0.0
          reset_mode: reference_state
          start_gate_choices: [0, 1, 2, 3, 4, 5, 6]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.4
          goal_mode: pass_gate_i
          horizon: 700
          max_collective_thrust_g: 5.0
          max_body_rate: 8.0
          ent_coeff_override: 0.0011
          reward_kwargs:
            time_penalty: 0.010
            body_rate_penalty: 0.0009
            action_smoothness_penalty: 0.008

        - name: stage1c_post_gate_recovery_20
          until_iter: 1050
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.0
          fixed_gate_yaw_noise: 0.0
          reset_mode: reference_state
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i_survive
          post_pass_success_steps: 20
          post_pass_max_speed_mps: 14.0
          post_pass_max_body_rate: 11.0
          horizon: 760
          max_collective_thrust_g: 5.0
          max_body_rate: 7.0
          ent_coeff_override: 0.0010
          reward_kwargs:
            time_penalty: 0.010
            body_rate_penalty: 0.0011
            action_smoothness_penalty: 0.010
            crash_penalty: 120.0

        - name: stage1d_post_gate_recovery_60
          until_iter: 1550
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.0
          fixed_gate_yaw_noise: 0.0
          reset_mode: reference_state
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i_survive
          post_pass_success_steps: 60
          post_pass_max_speed_mps: 14.0
          post_pass_max_body_rate: 11.0
          horizon: 820
          max_collective_thrust_g: 5.0
          max_body_rate: 7.0
          ent_coeff_override: 0.0010
          reward_kwargs:
            time_penalty: 0.010
            body_rate_penalty: 0.0011
            action_smoothness_penalty: 0.010
            crash_penalty: 120.0

        - name: stage1e_post_gate_recovery_100
          until_iter: 2150
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.0
          fixed_gate_yaw_noise: 0.0
          reset_mode: reference_state
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i_survive
          post_pass_success_steps: 100
          post_pass_max_speed_mps: 14.0
          post_pass_max_body_rate: 11.0
          horizon: 880
          max_collective_thrust_g: 5.0
          max_body_rate: 7.0
          ent_coeff_override: 0.0009
          reward_kwargs:
            time_penalty: 0.010
            body_rate_penalty: 0.0011
            action_smoothness_penalty: 0.010
            crash_penalty: 120.0

        - name: stage2a_two_gate_controlled
          until_iter: 3200
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.0
          fixed_gate_yaw_noise: 0.0
          reset_mode: reference_state
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.0
          goal_mode: gate_i_to_i+1
          horizon: 980
          max_collective_thrust_g: 5.0
          max_body_rate: 7.0
          ent_coeff_override: 0.0009
          reward_kwargs:
            time_penalty: 0.010
            body_rate_penalty: 0.0010
            action_smoothness_penalty: 0.009
            crash_penalty: 115.0

        - name: stage2b_two_gate_full_authority
          until_iter: 4200
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.0
          fixed_gate_yaw_noise: 0.0
          reset_mode: reference_state
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.5
          goal_mode: gate_i_to_i+1
          horizon: 1000
          max_collective_thrust_g: 5.25
          max_body_rate: 8.0
          ent_coeff_override: 0.0009
          reward_kwargs:
            time_penalty: 0.011
            body_rate_penalty: 0.0009
            action_smoothness_penalty: 0.008
            crash_penalty: 105.0

        - name: stage2c_two_gate_target
          until_iter: 5000
          num_gates: 7
          random_start_gate: false
          fixed_gate_pos_noise: 0.0
          fixed_gate_yaw_noise: 0.0
          reset_mode: reference_state
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 4.0
          goal_mode: gate_i_to_i+1
          horizon: 1000
          max_collective_thrust_g: 5.5
          max_body_rate: 8.0
          ent_coeff_override: 0.0009
          reward_kwargs:
            time_penalty: 0.012
            body_rate_penalty: 0.0008
            action_smoothness_penalty: 0.008
            crash_penalty: 95.0

training:
  trainer_type: ppo_flightmare
  max_grad_norm: 0.5
  logging_steps: 1
  save_steps: 50
  save_total_limit: 80
  save_final: true
  save_optimizer_state: true
  best_steps: 1
  selection_metric: rollout_score
  rollout_score_weights:
    success_rate: 1.0
    mean_goal_completion: 0.35
    mean_gate_completion: 0.0
    mean_speed_mps: 0.0
    mean_reward: 0.0
    mean_length: 0.0
    stage_index: 0.12

  bf16: false
  output_dir: outputs/${run.name}

wandb:
  project: flightmare-ppo
  entity: andrewolvera
  run_name: ${run.name}
  tags: [flightmare, ppo, state-only, ctbr, teacher, v7, racing-plant, stage12, packed-envs, squashed-actions]
