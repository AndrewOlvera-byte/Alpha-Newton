# Teacher CTBR PPO v8 — a curriculum where every stage's optimum already
# points at the final-task optimum under the PPO learning dynamics.
#
# ----------------------------------------------------------------------------
# THE DESIGN PRINCIPLE (read this before touching anything below)
# ----------------------------------------------------------------------------
# v5/v6/v7 all hit the same wall: `pass_gate_i` single-gate stages trained to
# success=1.0, then the first `gate_i_to_i+1` chaining stage collapsed to ~0.
# The cause was NOT a bug and NOT an impossible task. It was that single-gate
# and chaining are different problems whose optima point in opposite
# directions:
#
#   * `pass_gate_i` terminates the episode AT the gate, so its optimal policy is
#     a ballistic "punch straight through the hole as fast as possible." Nothing
#     constrains the EXIT state because there is no "after."
#   * `gate_i_to_i+1` reuses the same reset-gifted slow entry into gate i, but
#     now the hard part is the EXIT — curving out of gate i onto the line into
#     gate i+1. Single-gate training never exercised that and actively trained
#     against it (max forward speed = worst possible turn-in state).
#
# PPO is a *local* improver: it nudges the current behavior and keeps what
# scores better. If stage N's optimum is a sharp, confident basin pointed away
# from stage N+1's solution, there is no local gradient out — you've built a
# wall, not a ramp. On top of that, the critic that learned V(near-gate)=+bonus
# (terminal) becomes flatly wrong when the gate stops being terminal, so the
# advantages go to noise exactly when the hard part begins (v5 explained_var
# 0.98 -> 0.40 at the switch).
#
# The fix is a curriculum invariant:
#
#     EVERY stage's optimal policy must remain approximately optimal for the
#     next stage — including the parts (exit state, alignment to the next gate)
#     that don't pay off until later.
#
# This config enforces that invariant three ways:
#
#   1. NEVER use plain `pass_gate_i`. From stage one we use
#      `pass_gate_i_align_next`, which only counts the gate as "solved" if, AFTER
#      passing it, the drone stays on a viable line toward the NEXT gate
#      (bounded center error / signed distance to gate i+1) at a controlled
#      speed. So the single-gate optimum is ALREADY "pass aligned for the next
#      turn" — geometrically the same skill chaining needs. The dive is never a
#      profitable local optimum, so PPO never falls into it.
#
#   2. CHANGE ONE THING PER STAGE, A LITTLE. Reward fn, plant, and goal
#      philosophy stay fixed; we only tighten alignment tolerance, then raise
#      speed, then raise authority — each a small step so the previous optimum
#      is a good initializer for the next. The only genuine discontinuity left
#      (align_next -> gate_i_to_i+1) is made tiny because align_next already
#      assigned positive value to a good post-gate state.
#
#   3. CRITIC WARMUP AT THE ONE DISCONTINUITY. At the align_next -> gate_i_to_i+1
#      switch we run a short stage with `actor_lr_override` near zero: the critic
#      refits the new bootstrap targets while the policy is frozen, so when the
#      policy is unfrozen its advantages are trustworthy. (This needed a tiny
#      trainer change: actor_lr_override is now a recognized stage override.)
#
# Also reverted vs v7: NO action squashing. v7's `squash_actions` parametrized
# the Gaussian mean via atanh(mu/clip), which makes KL explode near the action
# bounds (v7 approx_kl 0.1–6 vs target 0.008; v5 without it was 0.003). We go
# back to v5's bounded-clamp actions + fp32, which had clean PPO dynamics.
#
# Start point: the v5 racing-plant BC checkpoint. We deliberately do NOT resume
# a PPO checkpoint — those already contain the dive prior we are trying to never
# learn. The curriculum must be correct from scratch.
#
# Prereqs (same BC as v5/v7):
#   1. bash scripts/flightmare_bc/collect_v5.sh
#   2. python -m src.entrypoints.train_bc --exp flightmare/paper/teacher/ctbr_bc
#
# Run:
#   docker compose exec alpha-newton python -m src.entrypoints.train_ppo \
#     --exp flightmare/paper/teacher/ctbr_stage12_v8_ppo

run:
  name: paper_teacher_ctbr_stage12_v8_ppo
  mode: ppo
  seed: 0

data:
  type: flightmare_ppo_state
  data_dir: data/flightmare/bc_v5
  action_type: ctbr
  obs_schema: v3
  normalize_state: true
  normalize_action: true
  action_normalization: bounds

robotics:
  architecture:
    type: flightmare_actor
    mode: ppo
    action_type: ctbr
    bc_checkpoint: outputs/paper_teacher_ctbr_bc_v5/best/model.pt

    fusion: swift
    proprio_core_dim: 9
    gate_dim: 24
    aux_dim: 3
    action_dim: 4
    use_vision: false
    include_prev_action: true

    proprio_hidden_dim: 128
    proprio_embed_dim: 128
    gate_hidden_dim: 128
    gate_embed_dim: 128
    trunk_hidden_dim: 768
    trunk_depth: 3
    dropout: 0.05

    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: false
    # Bounded-clamp actions (NOT tanh-squashed). init=-2.3 -> sigma~0.10, small
    # enough that exploration noise doesn't saturate the bounds on its own.
    init_log_std: -2.3
    log_std_min: -4.0
    log_std_max: -1.6
    with_critic: true
    critic_hidden_dim: 256
    critic_depth: 2
    bc_loss_type: gnll
    action_clip: 1.0
    # The v7 KL-explosion fix: keep actions on bounded support WITHOUT routing
    # the mean through atanh. Clean KL near the bounds.
    squash_actions: false

  ppo:
    bc_checkpoint: outputs/paper_teacher_ctbr_bc_v5/best/model.pt
    action_type: ctbr

    obs_schema: v3
    backend: flightgym
    render: false
    scene: industrial

    # 32 envs x 512 steps = 16384 samples/iter. Larger batches lower per-step KL
    # for a given LR, which (with no squashing) keeps updates well inside
    # target_kl without the tiny clip_eps gymnastics earlier configs needed.
    n_envs: 32
    n_workers: 8
    n_steps: 512
    ppo_epochs: 3
    minibatch_size: 4096
    clip_eps: 0.1
    vf_coeff: 0.5
    ent_coeff: 0.0012
    gamma: 0.997
    gae_lambda: 0.95
    max_iterations: 4000
    # Racing plant realizes ~3x the angular response of the BC plant for the
    # same command, so the effective policy gradient is ~3x: keep actor LR low.
    actor_lr: 2.0e-6
    critic_lr: 1.0e-4
    target_kl: 0.01

    control_hz: 100.0
    horizon: 1000

    course_mode: swift_v4
    num_gates: 7
    gate_size: 1.6
    gate_approach_m: 3.0
    z_min: 1.0
    fixed_gate_pos_noise: 0.00
    fixed_gate_yaw_noise: 0.00
    random_start_gate: false
    reset_mode: reference_state
    start_offset_m: 3.0
    start_offset_range: [2.0, 4.0]
    reference_speed_mps: 3.0
    # Base goal mode is the aligned single-gate task — see the design note. The
    # curriculum overrides this per stage; it is NEVER plain pass_gate_i.
    goal_mode: pass_gate_i_align_next

    gate_vehicle_radius: 0.20
    max_world_radius: 350.0
    min_z: -0.25
    terminate_on_gate_miss: true
    terminate_on_crash: true

    max_body_rate: 8.0
    max_collective_thrust_g: 5.5
    action_clip: 1.0

    plant:
      mass: 0.73
      arm_length: 0.17
      inertia: [0.0025, 0.0021, 0.0043]
      k_thrust: 1.91e-6
      k_torque: 2.6e-7
      motor_omega_min: 150.0
      motor_omega_max: 3000.0
      motor_tau: 0.0001
      thrust_map: [1.3298253500372892e-06, 0.0038360810526746033, -1.7689986848125325]
      kappa: 0.016
      omega_max_body: [18.0, 18.0, 18.0]

    # Base reward (v3): the key levers for THIS curriculum are the centerline
    # terms. centerline_progress + centerline_error reward reducing the lateral/
    # vertical error to the *current target gate* — which, once gate i is passed,
    # IS gate i+1. That is the dense signal that teaches the turn-out. gate_pass
    # and completion are kept moderate so "punch through" never out-earns "exit
    # clean," which is what made the dive an attractor before.
    reward_fn: flightmare_racing_v3
    reward_kwargs:
      gate_normal_progress_scale: 6.0
      segment_progress_scale: 1.5
      centerline_progress_scale: 4.0      # raised: this is the turn-in teacher
      centerline_error_penalty: 0.05
      aperture_near_penalty: 1.0
      aperture_near_m: 4.5
      velocity_alignment_scale: 0.04      # modest: do not pay raw forward speed
      body_alignment_scale: 0.04
      gate_pass_bonus: 22.0               # moderate: don't over-reward the punch
      segment_completion_bonus: 6.0
      completion_bonus: 160.0
      gate_miss_penalty: 90.0
      crash_penalty: 100.0
      no_progress_penalty: 0.10
      backward_progress_penalty: 2.0
      min_forward_velocity_mps: 0.75
      stall_grace_steps: 25
      time_penalty: 0.010
      body_rate_penalty: 0.0012
      action_smoothness_penalty: 0.010
      vertical_speed_penalty: 0.001
      max_progress_reward: 3.0
      max_centerline_progress: 2.0
      max_centerline_error: 6.0

    collapse_guard:
      enabled: false

    curriculum:
      enabled: true
      advance_metric: null          # iteration-based only; metric advance let
      advance_threshold: 1.0        # earlier runs promote on lucky episodes.
      stages:
        # ===================================================================
        # PHASE 1 — single gate, but the optimum is "exit aligned for the
        # next turn." This is the whole trick: we shape the EXIT state now, so
        # the single-gate skill IS the chaining skill. Authority/speed are low
        # and tolerances loose so BC has an easy basin to settle into.
        # ===================================================================
        - name: s1_align_anchor_lenient
          until_iter: 400
          start_gate_choices: [0, 1, 2, 3, 4, 5]   # leave a real "next gate"
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i_align_next
          # "Solved" = pass gate i, then for 15 steps stay pointed at gate i+1
          # (center error to i+1 within 2.5 apertures) without blowing past it.
          post_pass_success_steps: 15
          post_pass_max_center_error_norm: 2.5
          post_pass_min_gate_signed_distance_m: -10.0
          post_pass_max_speed_mps: 8.0
          post_pass_max_body_rate: 8.0
          horizon: 700
          max_collective_thrust_g: 4.5
          max_body_rate: 6.0
          ent_coeff_override: 0.0014
          reward_kwargs:
            time_penalty: 0.008
            body_rate_penalty: 0.0014
            action_smoothness_penalty: 0.012

        # Tighten the exit corridor and hold it longer. One knob moved a little.
        - name: s2_align_medium
          until_iter: 900
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i_align_next
          post_pass_success_steps: 35
          post_pass_max_center_error_norm: 2.0
          post_pass_min_gate_signed_distance_m: -8.0
          post_pass_max_speed_mps: 8.0
          post_pass_max_body_rate: 8.0
          horizon: 780
          max_collective_thrust_g: 4.8
          max_body_rate: 6.5
          ent_coeff_override: 0.0012
          reward_kwargs:
            centerline_progress_scale: 4.4
            centerline_error_penalty: 0.06

        # Tightest exit corridor + longest hold. By the end of this stage the
        # policy reliably leaves gate i centered on the line into gate i+1 at a
        # controlled speed — i.e. it has already learned the turn-out. This is
        # the state from which chaining is a SMALL step, not a cliff.
        - name: s3_align_tight
          until_iter: 1400
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i_align_next
          post_pass_success_steps: 70
          post_pass_max_center_error_norm: 1.6
          post_pass_min_gate_signed_distance_m: -6.0
          post_pass_max_speed_mps: 7.5
          post_pass_max_body_rate: 7.0
          horizon: 880
          max_collective_thrust_g: 5.0
          max_body_rate: 7.0
          ent_coeff_override: 0.0010
          reward_kwargs:
            centerline_progress_scale: 4.8
            centerline_error_penalty: 0.07

        # ===================================================================
        # PHASE 2 — the bridge. Switch the goal to actually chaining
        # (gate_i_to_i+1). Because Phase 1 already trained a good, well-valued
        # exit state, this is a small change. We still protect the one thing
        # that does change: the critic's bootstrap target near gate i flips from
        # "survive aligned then bonus" to "reach gate i+1." So for 150 iters we
        # FREEZE the policy (actor_lr ~0) and let the critic refit before the
        # policy is allowed to move. Same speed/authority as s3 — ONLY the goal
        # mode and the actor LR change.
        # ===================================================================
        - name: s4_chain_critic_warmup
          until_iter: 1550
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.0
          goal_mode: gate_i_to_i+1
          horizon: 1000
          max_collective_thrust_g: 5.0
          max_body_rate: 7.0
          ent_coeff_override: 0.0010
          actor_lr_override: 5.0e-8     # ~frozen policy: critic-only refit
          reward_kwargs:
            centerline_progress_scale: 4.8
            centerline_error_penalty: 0.07

        # Unfreeze the policy at the SAME distribution it warmed up on. Now the
        # advantages are trustworthy (critic refit in s4) and the policy already
        # exits gate i aligned (Phase 1), so chaining is learnable here.
        - name: s5_chain_controlled
          until_iter: 2300
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.0
          goal_mode: gate_i_to_i+1
          horizon: 1000
          max_collective_thrust_g: 5.0
          max_body_rate: 7.0
          ent_coeff_override: 0.0010
          reward_kwargs:
            centerline_progress_scale: 4.6
            centerline_error_penalty: 0.06

        # ===================================================================
        # PHASE 3 — ramp to the target distribution, ONE small step at a time,
        # always staying in gate_i_to_i+1 so the objective never changes again.
        # Speed and authority rise together and gradually; the previous stage's
        # policy is always a good initializer for the next.
        # ===================================================================
        - name: s6_chain_raise_speed
          until_iter: 3100
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.5
          goal_mode: gate_i_to_i+1
          horizon: 1000
          max_collective_thrust_g: 5.25
          max_body_rate: 7.5
          ent_coeff_override: 0.0009
          reward_kwargs:
            time_penalty: 0.011
            body_rate_penalty: 0.0010

        # Target distribution: 4.0 m/s, full body-rate and thrust authority.
        # This is the only stage the paper evaluates; it gets the longest tail.
        - name: s7_chain_target
          until_iter: 4000
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 4.0
          goal_mode: gate_i_to_i+1
          horizon: 1000
          max_collective_thrust_g: 5.5
          max_body_rate: 8.0
          ent_coeff_override: 0.0009
          reward_kwargs:
            time_penalty: 0.012
            body_rate_penalty: 0.0008

training:
  trainer_type: ppo_flightmare
  max_grad_norm: 0.5
  logging_steps: 1
  save_steps: 50
  save_total_limit: 80
  save_final: true
  save_optimizer_state: true
  best_steps: 1
  selection_metric: rollout_score
  # Select on STAGE-RELATIVE goal_completion, not gate_completion. gate_completion
  # = current_index/num_gates is ~0.5 in every stage purely from the start-gate
  # index — a constant that dilutes success-based selection. goal_completion
  # measures progress within the active goal window, which is what we care about.
  rollout_score_weights:
    success_rate: 1.0
    mean_goal_completion: 0.35
    mean_gate_completion: 0.0
    mean_speed_mps: 0.0
    mean_reward: 0.0
    mean_length: 0.0
    stage_index: 0.10

  # fp32: PPO grad norms on the racing plant can reach the bf16 representable
  # range at stage transitions (the bridge run's 1.8e13 grad norm was bf16
  # overflow, not a real gradient). ~15% slower, removes that failure class.
  bf16: false
  output_dir: outputs/${run.name}

wandb:
  project: flightmare-ppo
  entity: andrewolvera
  run_name: ${run.name}
  tags: [flightmare, ppo, state-only, ctbr, teacher, v8, racing-plant, aligned-curriculum, critic-warmup]
