# Teacher CTBR PPO v9 — geometry-ordered + aligned curriculum.
#
# ----------------------------------------------------------------------------
# WHAT v8 TAUGHT US (the live run, iter ~550)
# ----------------------------------------------------------------------------
# v8 fixed the optimizer (no squashing -> approx_kl 0.002 clean, explained_var
# 0.92-0.95, fp32 stable). PPO is healthy. But the curriculum stalled one level
# up, the SAME class of mistake as before: I built a Phase-1 sub-task whose
# optimum is partially UNREACHABLE, so it could not converge and could not point
# cleanly at Phase 2.
#
#   * s1 (pass_gate_i_align_next) plateaued at success ~0.50 and stopped
#     climbing; ~27% of episodes CRASHED at the low authority I set.
#   * s2 tightened the corridor and success collapsed to ~0.05, gate_misses
#     exploded to ~57/iter.
#
# Two root causes, both measured:
#
#   1. UNIFORM ALIGNMENT TOLERANCE OVER NON-UNIFORM GEOMETRY. This is the
#      Split-S course. Measured heading turn the drone must make leaving each
#      gate (scratch/analysis/course_turn_angles.py):
#          0->1: 5.7deg   1->2: 13.6deg  5->6: 18.4deg
#          4->5: 20.9deg  2->3: 30.0deg (seg 9.2m)  3->4: 37.4deg (seg 10m)
#      A fixed post_pass_max_center_error_norm makes 0/1/5/4 trivial but makes
#      the sharp, short-segment 2->3 and 3->4 physically unsatisfiable at low
#      speed/authority. The ~0.50 ceiling is just "the easy 4/6 of start gates
#      pass, the sharp 2 fail." Averaging hid the non-convergence.
#
#   2. AUTHORITY THROTTLED BACKWARDS. I lowered thrust/rate early "to be gentle."
#      But the turn-OUT is the most authority-hungry skill in the task — a sharp
#      corner needs MORE body rate than a straight dive, not less. Low authority
#      + sharp turn = loss of control = the 27% crash rate.
#
# ----------------------------------------------------------------------------
# THE v9 FIX — layer two geometric curricula so every start gate's target is
# reachable in the stage it appears:
#
#   A. ORDER THE GEOMETRY. start_gate_choices grows easy->hard by measured turn
#      angle: [0,1] -> [0,1,4,5] -> [0..5]. Sharp gates 2,3 only appear once the
#      policy and (high) authority can actually make their corner. The ordering
#      itself is the shaping — each stage is literally an easier turn than the
#      next.
#   B. ALIGNED EXIT, LOOSE->TIGHT. Still pass_gate_i_align_next (exit pointed at
#      the next gate), but tolerance starts loose so even the hard gates can
#      satisfy it when they're introduced, then tightens.
#   C. HIGH AUTHORITY, LOW SPEED in Phase 1. Slow != low authority. Speed stays
#      3.0 (safe) while thrust/rate are near full so the corner is makeable.
#   D. RAMPED critic warmup. The align_next -> gate_i_to_i+1 switch gets a frozen
#      critic-refit stage, then a PARTIAL unfreeze, then full — no hard step that
#      reintroduces a discontinuity.
#
# Start point: v5 racing-plant BC checkpoint (NOT a PPO resume — never inherit a
# dive prior). v8 is left running for observation; this is a separate run.
#
# Run:
#   docker compose exec alpha-newton python -m src.entrypoints.train_ppo \
#     --exp flightmare/paper/teacher/ctbr_stage12_v9_ppo

run:
  name: paper_teacher_ctbr_stage12_v9_ppo
  mode: ppo
  seed: 0

data:
  type: flightmare_ppo_state
  data_dir: data/flightmare/bc_v5
  action_type: ctbr
  obs_schema: v3
  normalize_state: true
  normalize_action: true
  action_normalization: bounds

robotics:
  architecture:
    type: flightmare_actor
    mode: ppo
    action_type: ctbr
    bc_checkpoint: outputs/paper_teacher_ctbr_bc_v5/best/model.pt

    fusion: swift
    proprio_core_dim: 9
    gate_dim: 24
    aux_dim: 3
    action_dim: 4
    use_vision: false
    include_prev_action: true

    proprio_hidden_dim: 128
    proprio_embed_dim: 128
    gate_hidden_dim: 128
    gate_embed_dim: 128
    trunk_hidden_dim: 768
    trunk_depth: 3
    dropout: 0.05

    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: false
    init_log_std: -2.3
    log_std_min: -4.0
    log_std_max: -1.6
    with_critic: true
    critic_hidden_dim: 256
    critic_depth: 2
    bc_loss_type: gnll
    # Bounds-mode maps [-1, 1] to the empirical BC label envelope. The racing
    # plant can turn harder than those labels, so PPO gets limited, explicit
    # extrapolation without shifting the BC warm-start's zero-action semantics.
    action_clip: 1.5
    squash_actions: false        # v7 KL-explosion source; stay bounded-clamp

  ppo:
    bc_checkpoint: outputs/paper_teacher_ctbr_bc_v5/best/model.pt
    action_type: ctbr

    obs_schema: v3
    backend: flightgym
    render: false
    scene: industrial

    n_envs: 32
    n_workers: 8
    n_steps: 512
    ppo_epochs: 3
    minibatch_size: 4096
    clip_eps: 0.1
    vf_coeff: 0.5
    ent_coeff: 0.0012
    gamma: 0.997
    gae_lambda: 0.95
    max_iterations: 4500
    actor_lr: 2.0e-6
    critic_lr: 1.0e-4
    target_kl: 0.01

    control_hz: 100.0
    horizon: 1000

    course_mode: swift_v4
    num_gates: 7
    gate_size: 1.6
    gate_approach_m: 3.0
    z_min: 1.0
    fixed_gate_pos_noise: 0.00
    fixed_gate_yaw_noise: 0.00
    random_start_gate: false
    reset_mode: reference_state
    start_offset_m: 3.0
    start_offset_range: [2.0, 4.0]
    reference_speed_mps: 3.0
    goal_mode: pass_gate_i_align_next

    gate_vehicle_radius: 0.20
    max_world_radius: 350.0
    min_z: -0.25
    terminate_on_gate_miss: true
    terminate_on_crash: true

    max_body_rate: 8.0
    max_collective_thrust_g: 5.5
    action_clip: 1.5

    plant:
      mass: 0.73
      arm_length: 0.17
      inertia: [0.0025, 0.0021, 0.0043]
      k_thrust: 1.91e-6
      k_torque: 2.6e-7
      motor_omega_min: 150.0
      motor_omega_max: 3000.0
      motor_tau: 0.0001
      thrust_map: [1.3298253500372892e-06, 0.0038360810526746033, -1.7689986848125325]
      kappa: 0.016
      omega_max_body: [18.0, 18.0, 18.0]

    reward_fn: flightmare_racing_v3
    reward_kwargs:
      gate_normal_progress_scale: 6.0
      segment_progress_scale: 1.5
      centerline_progress_scale: 4.0      # the turn-in teacher
      centerline_error_penalty: 0.05
      aperture_near_penalty: 1.0
      aperture_near_m: 4.5
      velocity_alignment_scale: 0.04
      body_alignment_scale: 0.04
      gate_pass_bonus: 22.0
      segment_completion_bonus: 6.0
      completion_bonus: 160.0
      gate_miss_penalty: 90.0
      crash_penalty: 100.0
      no_progress_penalty: 0.10
      backward_progress_penalty: 2.0
      min_forward_velocity_mps: 0.75
      stall_grace_steps: 25
      time_penalty: 0.010
      body_rate_penalty: 0.0012
      action_smoothness_penalty: 0.010
      vertical_speed_penalty: 0.001
      speed_limit_mps: 7.5
      speed_limit_penalty: 0.08
      max_progress_reward: 3.0
      max_centerline_progress: 2.0
      max_centerline_error: 6.0

    collapse_guard:
      enabled: false

    curriculum:
      enabled: true
      advance_metric: null
      advance_threshold: 1.0
      stages:
        # ===================================================================
        # PHASE 1 — aligned single gate. HIGH authority, low speed. Start gates
        # grow easy->hard by measured turn angle so each gate is introduced only
        # when its corner is makeable. Tolerance starts loose, tightens late.
        # ===================================================================

        # Only the two near-straight transitions (0->1: 5.7deg, 1->2: 13.6deg).
        # Loose corridor, near-full authority. This MUST reach high success fast
        # — if it doesn't, nothing downstream can. It is the existence proof that
        # the aligned-exit skill is learnable at all.
        - name: s1_align_easy_gates
          until_iter: 300
          start_gate_choices: [0, 1]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i_align_next
          post_pass_success_steps: 12
          post_pass_max_center_error_norm: 3.0
          post_pass_min_gate_signed_distance_m: -10.0
          post_pass_max_speed_mps: 8.5
          post_pass_max_body_rate: 9.0
          horizon: 700
          max_collective_thrust_g: 5.0      # high authority, NOT throttled
          max_body_rate: 8.0
          ent_coeff_override: 0.0014
          reward_kwargs:
            time_penalty: 0.008
            body_rate_penalty: 0.0012

        # Add the medium turns (4->5: 20.9deg, 5->6: 18.4deg). Still loose-ish.
        - name: s2_align_add_medium_gates
          until_iter: 800
          start_gate_choices: [0, 1, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i_align_next
          post_pass_success_steps: 20
          post_pass_max_center_error_norm: 2.6
          post_pass_min_gate_signed_distance_m: -9.0
          post_pass_max_speed_mps: 8.5
          post_pass_max_body_rate: 9.0
          horizon: 760
          max_collective_thrust_g: 5.2
          max_body_rate: 8.0
          ent_coeff_override: 0.0012
          reward_kwargs:
            centerline_progress_scale: 4.4
            centerline_error_penalty: 0.055

        # Introduce the SHARP gates (2->3: 30deg/9.2m, 3->4: 37deg). Keep the
        # corridor only MODERATE — the goal here is just to get the hard corners
        # passing aligned, not to tighten them. Full body-rate authority.
        - name: s3_align_all_gates
          until_iter: 1400
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i_align_next
          post_pass_success_steps: 25
          post_pass_max_center_error_norm: 2.6
          post_pass_min_gate_signed_distance_m: -9.0
          post_pass_max_speed_mps: 8.0
          post_pass_max_body_rate: 8.0
          horizon: 820
          max_collective_thrust_g: 5.3
          max_body_rate: 8.0
          ent_coeff_override: 0.0011
          reward_kwargs:
            centerline_progress_scale: 4.6
            centerline_error_penalty: 0.06

        # Now tighten the exit corridor across ALL gates and hold longer. By the
        # end the policy leaves every gate centered on the line into the next.
        - name: s4_align_tighten_all
          until_iter: 1900
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i_align_next
          post_pass_success_steps: 50
          post_pass_max_center_error_norm: 1.9
          post_pass_min_gate_signed_distance_m: -7.0
          post_pass_max_speed_mps: 7.5
          post_pass_max_body_rate: 7.5
          horizon: 880
          max_collective_thrust_g: 5.2
          max_body_rate: 8.0
          ent_coeff_override: 0.0010
          reward_kwargs:
            centerline_progress_scale: 4.8
            centerline_error_penalty: 0.07

        # ===================================================================
        # PHASE 2 — bridge to chaining. The goal flips to gate_i_to_i+1, but the
        # policy already exits every gate aligned, so the BEHAVIOR barely needs
        # to change. We protect the one thing that does: the critic's bootstrap
        # target near each gate. Frozen refit -> partial unfreeze -> full, all at
        # the SAME speed/authority as s4.
        # ===================================================================

        # Frozen policy, critic-only refit of the new (non-terminal) gate values.
        - name: s5_chain_critic_warmup_frozen
          until_iter: 2050
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.0
          goal_mode: gate_i_to_i+1
          horizon: 1000
          max_collective_thrust_g: 5.2
          max_body_rate: 8.0
          ent_coeff_override: 0.0010
          actor_lr_override: 5.0e-8         # ~frozen
          reward_kwargs:
            centerline_progress_scale: 4.8
            centerline_error_penalty: 0.07

        # Partial unfreeze — ramp, don't step. Advantages are now trustworthy.
        - name: s6_chain_partial_unfreeze
          until_iter: 2300
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.0
          goal_mode: gate_i_to_i+1
          horizon: 1000
          max_collective_thrust_g: 5.2
          max_body_rate: 8.0
          ent_coeff_override: 0.0010
          actor_lr_override: 5.0e-7         # ~25% of base
          reward_kwargs:
            centerline_progress_scale: 4.7
            centerline_error_penalty: 0.065

        # Full actor LR, same distribution. This is where real chaining converges.
        - name: s7_chain_controlled
          until_iter: 3000
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.0
          goal_mode: gate_i_to_i+1
          horizon: 1000
          max_collective_thrust_g: 5.2
          max_body_rate: 8.0
          ent_coeff_override: 0.0009
          reward_kwargs:
            centerline_progress_scale: 4.6
            centerline_error_penalty: 0.06

        # ===================================================================
        # PHASE 3 — ramp to target distribution, one small step at a time, goal
        # never changes again.
        # ===================================================================
        - name: s8_chain_raise_speed
          until_iter: 3700
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 3.5
          goal_mode: gate_i_to_i+1
          horizon: 1000
          max_collective_thrust_g: 5.35
          max_body_rate: 8.0
          ent_coeff_override: 0.0009
          reward_kwargs:
            time_penalty: 0.011
            body_rate_penalty: 0.0010

        - name: s9_chain_target
          until_iter: 4500
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.0]
          reference_speed_mps: 4.0
          goal_mode: gate_i_to_i+1
          horizon: 1000
          max_collective_thrust_g: 5.5
          max_body_rate: 8.0
          ent_coeff_override: 0.0009
          reward_kwargs:
            time_penalty: 0.012
            body_rate_penalty: 0.0008

training:
  trainer_type: ppo_flightmare
  max_grad_norm: 0.5
  logging_steps: 1
  save_steps: 50
  save_total_limit: 80
  save_final: true
  save_optimizer_state: true
  best_steps: 1
  selection_metric: rollout_score
  rollout_score_weights:
    success_rate: 1.0
    mean_goal_completion: 0.35
    mean_gate_completion: 0.0
    mean_speed_mps: 0.0
    mean_reward: 0.0
    mean_length: 0.0
    stage_index: 0.10

  bf16: false
  output_dir: outputs/${run.name}

wandb:
  project: flightmare-ppo
  entity: andrewolvera
  run_name: ${run.name}
  tags: [flightmare, ppo, state-only, ctbr, teacher, v9, racing-plant, geometry-ordered, aligned-curriculum, critic-warmup]
