# Teacher CTBR PPO v11 stage23 continuation.
#
# v11 is learning the two-gate task, but the original stage-2 window is too
# short for the observed slope. This continuation resumes from the v11 run and
# follows the old successful pattern: finish two-gate transitions first, then
# train three-gate windows as a separate benchmark before adding longer courses.
#
# Current v11 signal at checkpoint-2250:
#   - stage 2 checkpoint success ~= 25%, best rollout ~= 38%
#   - mean goal completion ~= 61%
#   - crashes ~= 1 / rollout and action clipping ~= 0
#
# Extrapolation from the last 600 stage-2 iterations is roughly +3.1 success
# points / 100 iters. That puts stable ~70% two-gate success around iter
# 3900-4200, so this config holds stage 2 until iter 4300.
#
# If v11 has a better two-gate checkpoint by the time you stop it, update both
# checkpoint paths below from checkpoint-2250 to that checkpoint before running.
#
# Run after stopping the active v11 trainer:
#   docker compose exec alpha-newton python -m src.entrypoints.train_ppo \
#     --exp flightmare/paper/teacher/ctbr_stage23_v11_ppo

run:
  name: paper_teacher_ctbr_stage23_v11_ppo
  mode: ppo
  seed: 0

data:
  type: flightmare_ppo_state
  data_dir: data/flightmare/bc_v5
  action_type: ctbr
  obs_schema: v3
  normalize_state: true
  normalize_action: true
  action_normalization: bounds

robotics:
  architecture:
    type: flightmare_actor
    mode: ppo
    action_type: ctbr
    bc_checkpoint: outputs/paper_teacher_ctbr_stage12_v11_ppo/checkpoint-2500/model.pt

    fusion: swift
    proprio_core_dim: 9
    gate_dim: 24
    aux_dim: 3
    action_dim: 4
    use_vision: false
    include_prev_action: true

    proprio_hidden_dim: 128
    proprio_embed_dim: 128
    gate_hidden_dim: 128
    gate_embed_dim: 128
    trunk_hidden_dim: 768
    trunk_depth: 3
    dropout: 0.05

    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: false
    init_log_std: -2.30
    log_std_min: -4.0
    log_std_max: -1.6
    with_critic: true
    critic_hidden_dim: 256
    critic_depth: 2
    bc_loss_type: gnll
    action_clip: 1.35
    squash_actions: false

  ppo:
    bc_checkpoint: outputs/paper_teacher_ctbr_stage12_v11_ppo/checkpoint-2500/model.pt
    resume_from: outputs/paper_teacher_ctbr_stage12_v11_ppo/checkpoint-2500
    reset_best_on_resume: true
    action_type: ctbr

    obs_schema: v3
    backend: flightgym
    render: false
    scene: industrial

    n_envs: 32
    n_workers: 8
    n_steps: 768
    ppo_epochs: 3
    minibatch_size: 4096
    clip_eps: 0.06
    vf_coeff: 0.5
    ent_coeff: 0.0011
    gamma: 0.997
    gae_lambda: 0.95
    max_iterations: 7600
    actor_lr: 2.2e-6
    critic_lr: 1.0e-4
    target_kl: 0.010

    control_hz: 100.0
    horizon: 1200

    course_mode: swift_v4
    num_gates: 7
    gate_size: 1.6
    gate_approach_m: 3.0
    z_min: 1.0
    fixed_gate_pos_noise: 0.00
    fixed_gate_yaw_noise: 0.00
    random_start_gate: false
    reset_mode: reference_state
    start_offset_m: 3.0
    start_offset_range: [2.0, 4.5]
    start_lateral_range_m: [0.0, 0.0]
    start_vertical_range_m: [0.0, 0.0]
    start_yaw_noise_rad: 0.0
    start_speed_noise_mps: 0.0
    reference_speed_mps: 3.0
    goal_mode: gate_i_to_i+1
    goal_gate_span: null

    gate_vehicle_radius: 0.20
    max_world_radius: 350.0
    min_z: -0.25
    terminate_on_gate_miss: true
    terminate_on_crash: true

    max_body_rate: 8.0
    max_collective_thrust_g: 5.5
    action_clip: 1.35

    plant:
      mass: 0.73
      arm_length: 0.17
      inertia: [0.0025, 0.0021, 0.0043]
      k_thrust: 1.91e-6
      k_torque: 2.6e-7
      motor_omega_min: 150.0
      motor_omega_max: 3000.0
      motor_tau: 0.0001
      thrust_map: [1.3298253500372892e-06, 0.0038360810526746033, -1.7689986848125325]
      kappa: 0.016
      omega_max_body: [18.0, 18.0, 18.0]

    reward_fn: flightmare_racing_v3
    reward_kwargs:
      gate_normal_progress_scale: 6.0
      segment_progress_scale: 1.7
      centerline_progress_scale: 3.3
      centerline_error_penalty: 0.045
      aperture_near_penalty: 0.85
      aperture_near_m: 4.5
      velocity_alignment_scale: 0.05
      body_alignment_scale: 0.04
      gate_pass_bonus: 26.0
      segment_completion_bonus: 7.0
      completion_bonus: 175.0
      gate_miss_penalty: 95.0
      crash_penalty: 110.0
      no_progress_penalty: 0.10
      backward_progress_penalty: 2.0
      min_forward_velocity_mps: 0.75
      stall_grace_steps: 25
      time_penalty: 0.010
      body_rate_penalty: 0.0010
      action_smoothness_penalty: 0.010
      vertical_speed_penalty: 0.0012
      speed_limit_mps: 8.0
      speed_limit_penalty: 0.08
      max_progress_reward: 3.0
      max_centerline_progress: 2.0
      max_centerline_error: 6.0

    collapse_guard:
      enabled: false

    curriculum:
      enabled: true
      advance_metric: null
      advance_threshold: 1.0
      stages:
        - name: s2_two_gate_windows_finish
          until_iter: 4300
          advance_metric: success_rate
          advance_threshold: 0.68
          advance_after_iter: 3900
          advance_patience: 16
          reset_mode: reference_state
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.20, 0.20]
          start_vertical_range_m: [-0.15, 0.15]
          start_yaw_noise_rad: 0.08
          start_speed_noise_mps: 0.20
          reference_speed_mps: 3.0
          goal_mode: gate_i_to_i+1
          goal_gate_span: null
          horizon: 1050
          max_collective_thrust_g: 5.35
          max_body_rate: 8.0
          ent_coeff_override: 0.00115
          reward_kwargs:
            centerline_progress_scale: 3.4
            centerline_error_penalty: 0.045
            time_penalty: 0.010
            body_rate_penalty: 0.0010
            action_smoothness_penalty: 0.010
            speed_limit_mps: 8.0

        - name: s3_three_gate_windows
          until_iter: 7600
          advance_metric: success_rate
          advance_threshold: 0.55
          advance_after_iter: 6500
          advance_patience: 16
          reset_mode: segment_window
          start_gate_choices: [0, 1, 2, 3, 4]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.20, 0.20]
          start_vertical_range_m: [-0.15, 0.15]
          start_yaw_noise_rad: 0.08
          start_speed_noise_mps: 0.25
          reference_speed_mps: 3.2
          goal_mode: gate_i_to_i+2
          goal_gate_span: null
          horizon: 1400
          max_collective_thrust_g: 5.4
          max_body_rate: 8.0
          ent_coeff_override: 0.0010
          reward_kwargs:
            centerline_progress_scale: 3.5
            centerline_error_penalty: 0.048
            time_penalty: 0.011
            body_rate_penalty: 0.0009
            action_smoothness_penalty: 0.009
            speed_limit_mps: 8.5

training:
  trainer_type: ppo_flightmare
  max_grad_norm: 0.5
  logging_steps: 1
  save_steps: 50
  save_total_limit: 120
  save_final: true
  save_optimizer_state: true
  best_steps: 1
  selection_metric: rollout_score
  rollout_score_weights:
    success_rate: 1.0
    mean_goal_completion: 0.30
    mean_gate_completion: 0.05
    mean_speed_mps: 0.0
    mean_reward: 0.0
    mean_length: 0.0
    stage_index: 0.12

  bf16: false
  output_dir: outputs/${run.name}

wandb:
  project: flightmare-ppo
  entity: andrewolvera
  run_name: ${run.name}
  tags: [flightmare, ppo, state-only, ctbr, teacher, v11, stage23, racing-plant, simple-gate-count]
