# Teacher CTBR PPO v12 stage23 continuation.
#
# v11 stage23 exposed two issues:
#   1. The run should resume from the best two-gate policy, not the latest
#      degraded live checkpoint.
#   2. Multi-gate learning needs realistic post-pass reset states, not only
#      clean synthetic pre-gate reference starts.
#
# v12 therefore warm-starts weights from the v11 stage23 best checkpoint but
# intentionally does not resume optimizer state, iteration counters, or best
# bookkeeping. It uses trajectory_replay_or_reference resets, prevents
# timeout-only advancement out of two-gate, and adds a short critic-only warmup
# before three-gate actor updates. Rollout parallelism is raised from 32x8 to
# 44x11 (+37.5%) while minibatch size is scaled to keep the PPO update geometry
# close to v11.
#
# Run:
#   docker compose exec alpha-newton python -m src.entrypoints.train_ppo \
#     --exp flightmare/paper/teacher/ctbr_stage23_v12_ppo

run:
  name: paper_teacher_ctbr_stage23_v12_ppo
  mode: ppo
  seed: 0

data:
  type: flightmare_ppo_state
  data_dir: data/flightmare/bc_v5
  action_type: ctbr
  obs_schema: v3
  normalize_state: true
  normalize_action: true
  action_normalization: bounds

robotics:
  architecture:
    type: flightmare_actor
    mode: ppo
    action_type: ctbr
    bc_checkpoint: outputs/paper_teacher_ctbr_stage23_v11_ppo/best/model.pt

    fusion: swift
    proprio_core_dim: 9
    gate_dim: 24
    aux_dim: 3
    action_dim: 4
    use_vision: false
    include_prev_action: true

    proprio_hidden_dim: 128
    proprio_embed_dim: 128
    gate_hidden_dim: 128
    gate_embed_dim: 128
    trunk_hidden_dim: 768
    trunk_depth: 3
    dropout: 0.05

    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: false
    init_log_std: -2.30
    log_std_min: -4.0
    log_std_max: -1.6
    with_critic: true
    critic_hidden_dim: 256
    critic_depth: 2
    bc_loss_type: gnll
    action_clip: 1.35
    squash_actions: false

  ppo:
    bc_checkpoint: outputs/paper_teacher_ctbr_stage23_v11_ppo/best/model.pt
    # Weight-only warm start. Leave resume_from null so PPO restarts optimizer,
    # iteration, and best-score state from scratch.
    resume_from: null
    reset_best_on_resume: false
    action_type: ctbr

    obs_schema: v3
    backend: flightgym
    render: false
    scene: industrial

    n_envs: 44
    n_workers: 11
    n_steps: 768
    ppo_epochs: 3
    minibatch_size: 5632
    clip_eps: 0.055
    vf_coeff: 0.5
    ent_coeff: 0.00105
    gamma: 0.997
    gae_lambda: 0.95
    max_iterations: 9800
    actor_lr: 1.45e-6
    critic_lr: 1.0e-4
    target_kl: 0.008

    control_hz: 100.0
    horizon: 1200

    course_mode: swift_v4
    num_gates: 7
    gate_size: 1.6
    gate_approach_m: 3.0
    z_min: 1.0
    fixed_gate_pos_noise: 0.00
    fixed_gate_yaw_noise: 0.00
    inverted_roll_jitter_rad: 0.0
    random_start_gate: false
    reset_mode: trajectory_replay_or_reference
    start_offset_m: 3.0
    start_offset_range: [2.0, 4.5]
    start_lateral_range_m: [0.0, 0.0]
    start_vertical_range_m: [0.0, 0.0]
    start_yaw_noise_rad: 0.0
    start_speed_noise_mps: 0.0
    reference_speed_mps: 3.0
    goal_mode: gate_i_to_i+1
    goal_gate_span: null

    trajectory_replay_capacity_per_gate: 96
    trajectory_replay_sample_prob: 0.20
    trajectory_replay_min_samples_per_gate: 8
    trajectory_replay_pos_noise_m: 0.04
    trajectory_replay_vel_noise_mps: 0.10
    trajectory_replay_omega_noise_radps: 0.06
    trajectory_replay_yaw_noise_rad: 0.010

    gate_vehicle_radius: 0.20
    max_world_radius: 350.0
    min_z: -0.25
    terminate_on_gate_miss: true
    terminate_on_crash: true

    max_body_rate: 8.0
    max_collective_thrust_g: 5.5
    action_clip: 1.35

    plant:
      mass: 0.73
      arm_length: 0.17
      inertia: [0.0025, 0.0021, 0.0043]
      k_thrust: 1.91e-6
      k_torque: 2.6e-7
      motor_omega_min: 150.0
      motor_omega_max: 3000.0
      motor_tau: 0.0001
      thrust_map: [1.3298253500372892e-06, 0.0038360810526746033, -1.7689986848125325]
      kappa: 0.016
      omega_max_body: [18.0, 18.0, 18.0]

    reward_fn: flightmare_racing_v3
    reward_kwargs:
      gate_normal_progress_scale: 6.0
      segment_progress_scale: 1.7
      centerline_progress_scale: 3.3
      centerline_error_penalty: 0.045
      aperture_near_penalty: 0.85
      aperture_near_m: 4.5
      velocity_alignment_scale: 0.05
      body_alignment_scale: 0.04
      gate_pass_bonus: 26.0
      segment_completion_bonus: 7.0
      completion_bonus: 175.0
      gate_miss_penalty: 95.0
      crash_penalty: 110.0
      no_progress_penalty: 0.10
      backward_progress_penalty: 2.0
      min_forward_velocity_mps: 0.75
      stall_grace_steps: 25
      time_penalty: 0.010
      body_rate_penalty: 0.0010
      action_smoothness_penalty: 0.010
      vertical_speed_penalty: 0.0012
      speed_limit_mps: 8.0
      speed_limit_penalty: 0.08
      max_progress_reward: 3.0
      max_centerline_progress: 2.0
      max_centerline_error: 6.0

    collapse_guard:
      enabled: false

    curriculum:
      enabled: true
      advance_metric: null
      advance_threshold: 1.0
      stages:
        - name: s2_two_gate_replay_finish
          until_iter: 6200
          advance_on_timeout: false
          advance_metric: success_rate
          advance_threshold: 0.62
          advance_after_iter: 3600
          advance_after_stage_iters: 300
          advance_patience: 18
          reset_mode: trajectory_replay_or_reference
          start_gate_choices: [0, 1, 2, 3, 4, 5]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.20, 0.20]
          start_vertical_range_m: [-0.15, 0.15]
          start_yaw_noise_rad: 0.08
          start_speed_noise_mps: 0.20
          reference_speed_mps: 3.0
          trajectory_replay_sample_prob: 0.20
          trajectory_replay_min_samples_per_gate: 8
          goal_mode: gate_i_to_i+1
          goal_gate_span: null
          horizon: 1050
          max_collective_thrust_g: 5.35
          max_body_rate: 8.0
          ent_coeff_override: 0.00105
          reward_kwargs:
            centerline_progress_scale: 3.4
            centerline_error_penalty: 0.045
            time_penalty: 0.010
            body_rate_penalty: 0.0010
            action_smoothness_penalty: 0.010
            speed_limit_mps: 8.0

        - name: s3_three_gate_replay_critic_warmup
          until_iter: 9000
          duration_iters: 200
          reset_mode: trajectory_replay_or_reference
          start_gate_choices: [0, 1, 2, 3, 4]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.18, 0.18]
          start_vertical_range_m: [-0.12, 0.12]
          start_yaw_noise_rad: 0.06
          start_speed_noise_mps: 0.20
          reference_speed_mps: 3.1
          trajectory_replay_sample_prob: 0.25
          trajectory_replay_min_samples_per_gate: 6
          goal_mode: gate_i_to_i+2
          goal_gate_span: null
          horizon: 1400
          max_collective_thrust_g: 5.4
          max_body_rate: 8.0
          ent_coeff_override: 0.0010
          actor_lr_override: 5.0e-8
          reward_kwargs:
            centerline_progress_scale: 3.45
            centerline_error_penalty: 0.047
            time_penalty: 0.011
            body_rate_penalty: 0.0009
            action_smoothness_penalty: 0.009
            speed_limit_mps: 8.4

        - name: s3_three_gate_replay_train
          until_iter: 9800
          advance_on_timeout: false
          advance_metric: success_rate
          advance_threshold: 0.50
          advance_after_stage_iters: 1200
          advance_patience: 18
          reset_mode: trajectory_replay_or_reference
          start_gate_choices: [0, 1, 2, 3, 4]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.20, 0.20]
          start_vertical_range_m: [-0.15, 0.15]
          start_yaw_noise_rad: 0.08
          start_speed_noise_mps: 0.25
          reference_speed_mps: 3.2
          trajectory_replay_sample_prob: 0.35
          trajectory_replay_min_samples_per_gate: 6
          goal_mode: gate_i_to_i+2
          goal_gate_span: null
          horizon: 1400
          max_collective_thrust_g: 5.4
          max_body_rate: 8.0
          ent_coeff_override: 0.0010
          reward_kwargs:
            centerline_progress_scale: 3.5
            centerline_error_penalty: 0.048
            time_penalty: 0.011
            body_rate_penalty: 0.0009
            action_smoothness_penalty: 0.009
            speed_limit_mps: 8.5

training:
  trainer_type: ppo_flightmare
  max_grad_norm: 0.5
  logging_steps: 1
  save_steps: 50
  save_total_limit: 160
  save_final: true
  save_optimizer_state: true
  best_steps: 1
  selection_metric: rollout_score
  rollout_score_weights:
    success_rate: 1.0
    mean_goal_completion: 0.30
    mean_gate_completion: 0.05
    mean_speed_mps: 0.0
    mean_reward: 0.0
    mean_length: 0.0
    stage_index: 0.12

  bf16: false
  output_dir: outputs/${run.name}

wandb:
  project: flightmare-ppo
  entity: andrewolvera
  run_name: ${run.name}
  tags: [flightmare, ppo, state-only, ctbr, teacher, v12, stage23, racing-plant, trajectory-replay]
