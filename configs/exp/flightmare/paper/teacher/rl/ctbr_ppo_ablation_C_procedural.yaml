# =============================================================================
# Teacher CTBR PPO — Ablation C: PROCEDURAL+swift distribution, replay curriculum
# =============================================================================
# Identical curriculum MECHANISM and hyperparameters to Ablation B
# (trajectory-replay + course-start anchor + restore-best + collapse-guard +
# critic-warmup micro-stage), same plant, same reward flightmare_racing_v3.
# Two differences vs B:
#   1. COURSE DISTRIBUTION (the ablation): procedural+swift instead of swift-only.
#   2. BC warm-start: outputs/paper_teacher_ctbr_bc_v6/best/model.pt — the v6
#      teacher BC from the DISTILLATION run on the aligned procedural+swift data
#      (bc_v7). This init is ON-distribution for the procedural courses (unlike
#      the swift-only v4 used by A/B), and is itself an interesting comparison.
#      data_dir is bc_v7 so PPO obs-normalization stats match that checkpoint.
#
#   - `course_distribution:` (flow / chicane / split_s / mixed_inverted + swift
#     anchors) copied from configs/exp/flightmare/paper/teacher/ctbr_bc_v6.yaml.
#     When course_distribution is set, sample_gate_course() delegates to the
#     procedural module and IGNORES course_mode (see scripts/flightmare_bc/collect.py
#     sample_gate_course): each episode resamples a course with 5-7 gates.
#
# B (swift_v4) vs C (procedural) isolates: the GENERALIZATION cost of training the
# teacher on the deployment distribution instead of the single anchor course.
#
# Notes for procedural training:
#   - num_gates is per-episode (5-7); start_gate_choices stay <= 4 so they are
#     valid on the shortest (5-gate) courses. goal terminal indices are clamped to
#     the episode's gate count by the env.
#   - trajectory replay is keyed per gate-index across DIFFERENT courses, so it is
#     noisier here than on fixed swift_v4; replay sample prob is kept modest and the
#     reference reset remains dominant.
#
# Run:
#   docker compose exec alpha-newton python -m src.entrypoints.train_ppo \
#     --exp flightmare/paper/teacher/rl/ctbr_ppo_ablation_C_procedural

run:
  name: paper_teacher_ctbr_ppo_ablC_procedural
  mode: ppo
  seed: 0

data:
  type: flightmare_ppo_state
  data_dir: data/flightmare/bc_v7
  action_type: ctbr
  obs_schema: v3
  normalize_state: true
  normalize_action: true
  action_normalization: bounds

robotics:
  architecture:
    type: flightmare_actor
    mode: ppo
    action_type: ctbr
    bc_checkpoint: outputs/paper_teacher_ctbr_bc_v6/best/model.pt

    fusion: swift
    proprio_core_dim: 9
    gate_dim: 24
    aux_dim: 3
    action_dim: 4
    use_vision: false
    include_prev_action: true

    proprio_hidden_dim: 128
    proprio_embed_dim: 128
    gate_hidden_dim: 128
    gate_embed_dim: 128
    trunk_hidden_dim: 768
    trunk_depth: 3
    dropout: 0.05

    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: false
    init_log_std: -2.30
    log_std_min: -4.0
    log_std_max: -1.6
    with_critic: true
    critic_hidden_dim: 256
    critic_depth: 2
    bc_loss_type: gnll
    action_clip: 1.35
    squash_actions: false

  ppo:
    bc_checkpoint: outputs/paper_teacher_ctbr_bc_v6/best/model.pt
    resume_from: null
    reset_best_on_resume: false
    restore_best_on_stage_transition: true
    action_type: ctbr

    obs_schema: v3
    backend: flightgym
    render: false
    scene: industrial

    n_envs: 32
    n_workers: 8
    n_steps: 768
    ppo_epochs: 3
    minibatch_size: 4096
    clip_eps: 0.06
    vf_coeff: 0.5
    ent_coeff: 0.0010
    gamma: 0.997
    gae_lambda: 0.95
    # Hard global cap (can never run forever). Procedural courses are harder and
    # more varied than swift-only, so the budget is larger and weighted to 2/3-gate.
    max_iterations: 14000
    actor_lr: 1.6e-6
    critic_lr: 1.0e-4
    target_kl: 0.010

    control_hz: 100.0
    horizon: 1200

    # Procedural distribution drives course geometry; course_mode is ignored when
    # course_distribution is present. num_gates is a fallback only.
    num_gates: 7
    gate_size: 1.6
    gate_approach_m: 3.0
    z_min: 1.0
    random_start_gate: false
    reset_mode: trajectory_replay_or_reference
    course_start_sample_prob: 0.12
    start_offset_m: 3.0
    start_offset_range: [2.0, 4.5]
    start_lateral_range_m: [0.0, 0.0]
    start_vertical_range_m: [0.0, 0.0]
    start_yaw_noise_rad: 0.0
    start_speed_noise_mps: 0.0
    reference_speed_mps: 3.0
    goal_mode: pass_gate_i
    goal_gate_span: null

    course_distribution:
      max_resample_tries: 24
      bounds:
        arena_radius: 80.0
        z_min: 1.0
        z_max: 6.0
        min_gate_clearance_m: 0.8
        min_consecutive_m: 7.0
        max_consecutive_m: 16.0
        max_climb_angle_rad: 1.0472
        max_heading_change_rad: 1.7453
        total_length_range: [40.0, 135.0]
        vehicle_radius: 0.20
      scenarios:
        - {name: flow_upright, family: procedural_flow, weight: 0.30, num_gates_range: [5, 7], spacing_range: [10.0, 13.0], z_range: [1.8, 4.0], gate_size: 1.6, gate_approach_m: 3.0, heading_step_range: [0.0, 0.3], lateral_jitter_m: 1.0, pos_noise_xyz: [0.12, 0.12, 0.08], yaw_noise_rad: 0.04}
        - {name: chicane, family: procedural_chicane, weight: 0.20, num_gates_range: [5, 7], spacing_range: [10.0, 13.0], z_range: [1.8, 3.5], gate_size: 1.6, gate_approach_m: 3.0, heading_step_range: [0.25, 0.45], lateral_jitter_m: 0.8, pos_noise_xyz: [0.12, 0.12, 0.08], yaw_noise_rad: 0.04}
        - {name: split_s, family: procedural_split_s, weight: 0.20, num_gates_range: [6, 7], spacing_range: [10.0, 13.0], z_range: [2.0, 4.5], gate_size: 1.6, gate_approach_m: 3.0, num_inverted_range: [1, 1], inverted_roll_jitter_rad: 0.2618, pos_noise_xyz: [0.12, 0.12, 0.08], yaw_noise_rad: 0.04}
        - {name: mixed_inverted, family: mixed_inverted, weight: 0.15, num_gates_range: [5, 7], spacing_range: [10.0, 13.0], z_range: [2.0, 4.5], gate_size: 1.6, gate_approach_m: 3.0, num_inverted_range: [0, 2], inverted_roll_jitter_rad: 0.2618, pos_noise_xyz: [0.12, 0.12, 0.08], yaw_noise_rad: 0.04}
        - {name: swift_v4_canonical, family: swift_v4_canonical, weight: 0.07, num_gates_range: [7, 7], gate_size: 1.6, gate_approach_m: 3.0, num_inverted_range: [1, 1], random_direction: false}
        - {name: swift_v4_noisy, family: swift_v4_noisy, weight: 0.08, num_gates_range: [7, 7], gate_size: 1.6, gate_approach_m: 3.0, num_inverted_range: [1, 1], inverted_roll_jitter_rad: 0.2618, pos_noise_xyz: [0.20, 0.20, 0.15], yaw_noise_rad: 0.05, random_direction: false}

    trajectory_replay_capacity_per_gate: 96
    trajectory_replay_sample_prob: 0.15
    trajectory_replay_min_samples_per_gate: 8
    trajectory_replay_pos_noise_m: 0.04
    trajectory_replay_vel_noise_mps: 0.10
    trajectory_replay_omega_noise_radps: 0.06
    trajectory_replay_yaw_noise_rad: 0.010

    gate_vehicle_radius: 0.20
    max_world_radius: 350.0
    min_z: -0.25
    terminate_on_gate_miss: true
    terminate_on_crash: true

    max_body_rate: 8.0
    max_collective_thrust_g: 5.5
    action_clip: 1.35

    plant:
      mass: 0.73
      arm_length: 0.17
      inertia: [0.0025, 0.0021, 0.0043]
      k_thrust: 1.91e-6
      k_torque: 2.6e-7
      motor_omega_min: 150.0
      motor_omega_max: 3000.0
      motor_tau: 0.0001
      thrust_map: [1.3298253500372892e-06, 0.0038360810526746033, -1.7689986848125325]
      kappa: 0.016
      omega_max_body: [18.0, 18.0, 18.0]

    reward_fn: flightmare_racing_v3
    reward_kwargs:
      gate_normal_progress_scale: 6.0
      segment_progress_scale: 1.7
      centerline_progress_scale: 3.2
      centerline_error_penalty: 0.045
      aperture_near_penalty: 0.85
      aperture_near_m: 4.5
      velocity_alignment_scale: 0.05
      body_alignment_scale: 0.04
      gate_pass_bonus: 26.0
      segment_completion_bonus: 7.0
      completion_bonus: 175.0
      gate_miss_penalty: 95.0
      crash_penalty: 110.0
      no_progress_penalty: 0.10
      backward_progress_penalty: 2.0
      min_forward_velocity_mps: 0.75
      stall_grace_steps: 25
      time_penalty: 0.012
      body_rate_penalty: 0.0010
      action_smoothness_penalty: 0.010
      vertical_speed_penalty: 0.0012
      speed_limit_mps: 8.0
      speed_limit_penalty: 0.08
      max_progress_reward: 3.0
      max_centerline_progress: 2.0
      max_centerline_error: 6.0

    collapse_guard:
      enabled: true
      after_iter: 700
      patience: 4
      min_success_rate: 0.24
      max_gate_completion: 0.46
      skip_update: true

    # Advancement semantics: advance EARLY once the stage metric holds for
    # `advance_patience` rollouts ("don't proceed unless it reaches an ok
    # number"); otherwise `until_iter` is a HARD CAP (advance_on_timeout default
    # true) so no stage runs forever. Budgets are generous on 2/3-gate; on
    # timeout, restore_best_on_stage_transition prevents carrying a half-baked
    # policy into the next stage.
    curriculum:
      enabled: true
      advance_metric: null
      advance_threshold: 1.0
      stages:
        - name: s1_one_gate
          until_iter: 900
          advance_metric: success_rate
          advance_threshold: 0.88
          advance_after_iter: 300
          advance_patience: 8
          reset_mode: reference_state
          course_start_sample_prob: 0.12
          start_gate_choices: [0, 1, 2, 3, 4]
          start_offset_range: [2.0, 4.2]
          start_lateral_range_m: [-0.15, 0.15]
          start_vertical_range_m: [-0.10, 0.10]
          start_yaw_noise_rad: 0.06
          start_speed_noise_mps: 0.15
          reference_speed_mps: 3.0
          goal_mode: pass_gate_i
          goal_gate_span: null
          horizon: 700
          max_collective_thrust_g: 5.2
          max_body_rate: 8.0
          ent_coeff_override: 0.0014
          reward_kwargs:
            time_penalty: 0.009
            body_rate_penalty: 0.0012
            action_smoothness_penalty: 0.011
            speed_limit_mps: 7.5

        - name: s2_two_gate_replay
          until_iter: 4000
          advance_metric: mean_goal_completion
          advance_threshold: 0.64
          advance_after_iter: 1800
          advance_after_stage_iters: 500
          advance_patience: 4
          reset_mode: trajectory_replay_or_reference
          course_start_sample_prob: 0.12
          start_gate_choices: [0, 1, 2, 3, 4]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.20, 0.20]
          start_vertical_range_m: [-0.15, 0.15]
          start_yaw_noise_rad: 0.08
          start_speed_noise_mps: 0.20
          reference_speed_mps: 3.0
          trajectory_replay_sample_prob: 0.15
          trajectory_replay_min_samples_per_gate: 8
          goal_mode: gate_i_to_i+1
          goal_gate_span: null
          horizon: 1100
          max_collective_thrust_g: 5.35
          max_body_rate: 8.0
          ent_coeff_override: 0.0011
          reward_kwargs:
            centerline_progress_scale: 3.4
            centerline_error_penalty: 0.045
            time_penalty: 0.010
            speed_limit_mps: 8.0

        - name: s3_three_gate_critic_warmup
          until_iter: 4300
          duration_iters: 300
          reset_mode: trajectory_replay_or_reference
          course_start_sample_prob: 0.10
          start_gate_choices: [0, 1, 2, 3, 4]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.18, 0.18]
          start_vertical_range_m: [-0.12, 0.12]
          start_yaw_noise_rad: 0.06
          start_speed_noise_mps: 0.20
          reference_speed_mps: 3.1
          trajectory_replay_sample_prob: 0.18
          trajectory_replay_min_samples_per_gate: 6
          goal_mode: gate_i_to_i+2
          goal_gate_span: null
          horizon: 1500
          max_collective_thrust_g: 5.4
          max_body_rate: 8.0
          ent_coeff_override: 0.0010
          actor_lr_override: 5.0e-8
          reward_kwargs:
            centerline_progress_scale: 3.45
            centerline_error_penalty: 0.047
            time_penalty: 0.011
            body_rate_penalty: 0.0009
            speed_limit_mps: 8.4

        - name: s3_three_gate_train
          until_iter: 9500
          advance_metric: mean_goal_completion
          advance_threshold: 0.56
          advance_after_stage_iters: 1800
          advance_patience: 4
          reset_mode: trajectory_replay_or_reference
          course_start_sample_prob: 0.12
          start_gate_choices: [0, 1, 2, 3, 4]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.20, 0.20]
          start_vertical_range_m: [-0.15, 0.15]
          start_yaw_noise_rad: 0.08
          start_speed_noise_mps: 0.25
          reference_speed_mps: 3.2
          trajectory_replay_sample_prob: 0.25
          trajectory_replay_min_samples_per_gate: 6
          goal_mode: gate_i_to_i+2
          goal_gate_span: null
          horizon: 1500
          max_collective_thrust_g: 5.4
          max_body_rate: 8.0
          ent_coeff_override: 0.0010
          reward_kwargs:
            centerline_progress_scale: 3.5
            centerline_error_penalty: 0.048
            time_penalty: 0.011
            body_rate_penalty: 0.0009
            action_smoothness_penalty: 0.009
            speed_limit_mps: 8.5

        - name: s4_full_course
          until_iter: 12000
          advance_metric: mean_goal_completion
          advance_threshold: 0.45
          advance_after_iter: 10200
          advance_patience: 6
          reset_mode: trajectory_replay_or_reference
          course_start_sample_prob: 0.18
          start_gate_choices: [0, 1, 2]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [-0.20, 0.20]
          start_vertical_range_m: [-0.15, 0.15]
          start_yaw_noise_rad: 0.08
          start_speed_noise_mps: 0.30
          reference_speed_mps: 3.5
          trajectory_replay_sample_prob: 0.20
          trajectory_replay_min_samples_per_gate: 6
          goal_mode: finish_remaining_course
          goal_gate_span: null
          horizon: 2000
          max_collective_thrust_g: 5.5
          max_body_rate: 8.0
          ent_coeff_override: 0.0009
          reward_kwargs:
            centerline_progress_scale: 3.5
            centerline_error_penalty: 0.050
            time_penalty: 0.012
            body_rate_penalty: 0.0008
            action_smoothness_penalty: 0.009
            speed_limit_mps: 9.0

        - name: s5_full_course_speed
          until_iter: 14000
          reset_mode: course_start
          start_gate_choices: [0]
          start_offset_range: [2.0, 4.5]
          start_lateral_range_m: [0.0, 0.0]
          start_vertical_range_m: [0.0, 0.0]
          start_yaw_noise_rad: 0.0
          start_speed_noise_mps: 0.0
          reference_speed_mps: 3.5
          goal_mode: finish_remaining_course
          goal_gate_span: null
          horizon: 2400
          max_collective_thrust_g: 5.5
          max_body_rate: 8.0
          ent_coeff_override: 0.0008
          reward_kwargs:
            centerline_progress_scale: 3.3
            centerline_error_penalty: 0.048
            time_penalty: 0.013
            body_rate_penalty: 0.0008
            action_smoothness_penalty: 0.008
            speed_limit_mps: 9.5

training:
  trainer_type: ppo_flightmare
  max_grad_norm: 0.5
  logging_steps: 1
  save_steps: 50
  save_total_limit: 160
  save_final: true
  save_optimizer_state: true
  best_steps: 1
  selection_metric: rollout_score
  rollout_score_weights:
    success_rate: 1.0
    mean_goal_completion: 0.45
    mean_gate_completion: 0.05
    mean_speed_mps: 0.0
    mean_reward: 0.0
    mean_length: 0.0
    stage_index: 0.20

  bf16: false
  output_dir: outputs/${run.name}

wandb:
  project: flightmare-ppo
  entity: andrewolvera
  run_name: ${run.name}
  tags: [flightmare, ppo, state-only, ctbr, teacher, ablation, C, procedural, generalization, trajectory-replay, critic-warmup, racing-plant, bc-v6]
