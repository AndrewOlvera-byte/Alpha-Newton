# Paper ablation — PPO curriculum on REAL Flightmare dynamics, waypoint actions.
# Warm-started from outputs/paper_waypoint_bc_v4/best/model.pt.
#
# Curriculum: 2g warmup -> 4g ramp -> 7g full Swift-scale. Per-stage env
# rebuild with looser early gate noise; speed pushed via reward + speed-aware
# selector once SR saturates.
#
# Run after BC training:
#   docker compose exec alpha-newton python -m src.entrypoints.train_ppo \
#     --exp flightmare/paper/waypoint_curriculum_ppo

run:
  name: paper_waypoint_curriculum_ppo_v4
  mode: ppo
  seed: 0

data:
  type: flightmare_ppo_state
  data_dir: data/flightmare/bc_v4
  action_type: waypoint
  obs_schema: v3
  normalize_state: true
  normalize_action: true
  action_normalization: bounds

robotics:
  architecture:
    type: flightmare_actor
    mode: ppo
    action_type: waypoint
    bc_checkpoint: outputs/paper_waypoint_bc_v4/best/model.pt

    fusion: swift
    proprio_core_dim: 9
    gate_dim: 24
    aux_dim: 3
    action_dim: 4
    use_vision: false
    include_prev_action: true

    proprio_hidden_dim: 128
    proprio_embed_dim: 128
    gate_hidden_dim: 128
    gate_embed_dim: 128
    trunk_hidden_dim: 768
    trunk_depth: 3
    dropout: 0.05

    head_hidden_dim: 256
    head_depth: 2
    state_dependent_std: false
    init_log_std: -2.0
    log_std_min: -4.0
    log_std_max: -1.2
    with_critic: true
    critic_hidden_dim: 256
    critic_depth: 2
    bc_loss_type: gnll
    action_clip: 1.0

  ppo:
    bc_checkpoint: outputs/paper_waypoint_bc_v4/best/model.pt
    action_type: waypoint

    obs_schema: v3
    backend: flightgym
    render: false
    scene: industrial

    n_envs: 8
    n_workers: 8
    n_steps: 1024
    ppo_epochs: 4
    minibatch_size: 2048
    clip_eps: 0.05
    vf_coeff: 0.5
    ent_coeff: 0.001
    gamma: 0.995
    gae_lambda: 0.95
    max_iterations: 8000
    actor_lr: 5.0e-6
    critic_lr: 1.5e-4
    target_kl: 0.015

    control_hz: 100.0
    horizon: 2500

    course_mode: swift_v4
    num_gates: 7
    gate_size: 1.6
    gate_approach_m: 3.0
    z_min: 1.0
    fixed_gate_pos_noise: 0.20
    fixed_gate_yaw_noise: 0.05
    random_start_gate: true

    gate_vehicle_radius: 0.20
    max_world_radius: 350.0
    min_z: -0.25
    terminate_on_gate_miss: true
    terminate_on_crash: true
    max_waypoint_speed: 35.0
    max_collective_thrust_g: 5.5
    action_clip: 1.0

    # Resume actor+critic (and optimizer state, if save_optimizer_state was on
    # when the source ckpt was written) from a previous PPO run's `best/`. The
    # earlier run peaked at iter 148 (stage 1, 52% SR, 74% gate completion)
    # then drifted off-manifold under the original asymmetric reward; this
    # config keeps that policy and re-launches with the rebalanced reward and
    # gate-miss handling.
    resume_from: outputs/paper_waypoint_curriculum_ppo_v4/best

    reward_fn: flightmare_racing_v1
    reward_kwargs:
      progress_scale: 6.0
      segment_progress_scale: 1.5
      # Symmetrize pass/miss so the policy stops being incentivized to
      # avoid aperture entries entirely. Old: +20 / -90 (4.5x asymmetric);
      # new: +40 / -40.
      gate_pass_bonus: 40.0
      completion_bonus: 220.0
      gate_miss_penalty: 40.0
      crash_penalty: 100.0
      time_penalty: 0.05
      body_rate_penalty: 0.0
      action_smoothness_penalty: 0.01
      alignment_scale: 0.05
      # Strengthen dense aperture-centering shaping (was 0.05 — drowned by the
      # sparse miss event), and tighten its influence radius from 8m to 4m so
      # the gradient targets the final approach window.
      gate_centering_penalty: 0.30
      gate_violation_penalty: 0.20
      gate_centering_near_m: 4.0
      max_progress_reward: 5.0

    curriculum:
      enabled: true
      advance_metric: success_rate
      # Was 0.5 — that fired at iter 148 mid stage 1 and pushed the policy to
      # stage 2 before consolidation. 0.85 keeps the policy on a stage until
      # it actually owns it.
      advance_threshold: 0.85
      stages:
        - name: warmup_2gates
          until_iter: 800
          num_gates: 2
          random_start_gate: false
          fixed_gate_pos_noise: 0.05
          fixed_gate_yaw_noise: 0.0
          horizon: 1200
          ent_coeff_override: 0.002
          # Stage 1 keeps strict gate-miss termination — at 2 gates the
          # episodes are short and the cleanliness signal helps the policy
          # learn the basic flight-through shape.
          terminate_on_gate_miss: true
        - name: ramp_4gates
          until_iter: 2500
          num_gates: 4
          random_start_gate: true
          fixed_gate_pos_noise: 0.10
          fixed_gate_yaw_noise: 0.03
          horizon: 1800
          ent_coeff_override: 0.001
          # Stages 2+: drop strict termination so a single missed aperture
          # doesn't end the episode. The policy keeps flying, accumulates
          # progress reward through later gates, and learns "loose-but-passing
          # > miss-and-die." This is the highest-leverage knob unstucking the
          # aperture-precision plateau seen in the first run.
          terminate_on_gate_miss: false
        - name: full_7gates
          until_iter: 8000
          num_gates: 7
          random_start_gate: true
          fixed_gate_pos_noise: 0.20
          fixed_gate_yaw_noise: 0.05
          horizon: 2500
          terminate_on_gate_miss: false

training:
  trainer_type: ppo_flightmare
  max_grad_norm: 0.5
  logging_steps: 1
  save_steps: 50
  save_total_limit: 12
  save_final: true
  # Persist AdamW state next to each saved checkpoint so future resume_from
  # picks up momentum/variance estimates instead of restarting them. Cheap
  # (~10 MB per ckpt for this 2M-param model).
  save_optimizer_state: true
  best_steps: 1
  selection_metric: rollout_score
  rollout_score_weights:
    success_rate: 1.0
    mean_gate_completion: 0.1
    mean_speed_mps: 0.03
    mean_reward: 0.0

  bf16: true
  output_dir: outputs/${run.name}

wandb:
  project: flightmare-ppo
  entity: andrewolvera
  run_name: ${run.name}
  tags: [flightmare, ppo, state-only, waypoint, v4, paper, flightgym-backend, curriculum]
