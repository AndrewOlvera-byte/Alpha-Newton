run:
  name: "qwen3_600M_rlvr_MS_DAPO"
  mode: "rlvr"

model:
  type: "hf_causal"
  id: "outputs/qwen3_600M_rlvr_MS_PPO_v2"
  dtype: "bfloat16"
  gradient_checkpointing: true

tokenizer:
  type: "hf"
  id: "Qwen/Qwen3-0.6B-Base"

data:
  type: "rlvr_allenai"
  source: "hf"
  train_path: "allenai/RLVR-GSM-MATH-IF-Mixed-Constraints"
  name: null
  max_prompt_len: 512
  num_proc: 12
  classify_answer_types: true
  exclude_datasets: ["ifeval"]

grpo:
  reward_function: "dapo_deepseek"
  num_generations: 8
  max_prompt_length: 512
  max_completion_length: 768
  beta: 0.002
  scale_rewards: "group"
  loss_type: "dapo"
  epsilon: 0.2
  temperature: 0.8
  top_p: 0.95
  top_k: 0
  use_vllm: true
  vllm_mode: "colocate"
  vllm_gpu_memory_utilization: 0.5
  vllm_enable_sleep_mode: true

training:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8

  learning_rate: 8.0e-6
  warmup_steps: 50
  max_steps: 625

  logging_steps: 10
  save_steps: 125
  eval_steps: 125

  bf16: true

  output_dir: "outputs/qwen3_600M_rlvr_MS_DAPO"

wandb:
  tags: ["qwen3-0.6b", "rlvr", "dapo", "deepseek-style", "gsm8k-math", "multi-stage", "stage-2", "typed-extraction", "pure-math"]
