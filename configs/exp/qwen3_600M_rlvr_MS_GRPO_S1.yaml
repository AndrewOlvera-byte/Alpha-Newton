run:
  name: "qwen3_600M_rlvr_MS_GRPO_S1"
  mode: "rlvr"

model:
  type: "hf_causal"
  id: "outputs/qwen_600M_sft_deepthought_math_optimal"
  dtype: "bfloat16"
  gradient_checkpointing: true

tokenizer:
  type: "hf"
  id: "Qwen/Qwen3-0.6B-Base"

data:
  type: "rlvr_allenai"
  source: "hf"
  train_path: "allenai/RLVR-GSM"
  eval_path: null
  name: null
  max_prompt_len: 512
  num_proc: 12

grpo:
  reward_function: "ppo_binary"
  num_generations: 8
  max_prompt_length: 512
  max_completion_length: 768
  beta: 0.015
  scale_rewards: "group"
  loss_type: "grpo"
  epsilon: 0.15
  temperature: 0.85
  top_p: 0.95
  top_k: 0
  use_vllm: true
  vllm_mode: "colocate"
  vllm_gpu_memory_utilization: 0.5
  vllm_enable_sleep_mode: true

training:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 16

  dataloader_num_workers: 8
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2

  learning_rate: 1.5e-5
  warmup_steps: 50
  max_steps: 600

  logging_steps: 10
  save_strategy: "no"

  bf16: true

  output_dir: "outputs/qwen3_600M_rlvr_MS_GRPO_S1"

wandb:
  tags: ["qwen3-0.6b", "rlvr", "grpo", "gsm8k", "multi-stage", "stage-1", "warmup", "format-learning", "s1", "8-gen"]

topk_eval:
  enabled: true
  mode: "gsm"
  k: 3
  eval_dataset_path: "held_out/gsm_eval.jsonl"
  eval_every_n_steps: 10
  source_type: "local"
  reward_function: "ppo_binary"
  difficulty_weights:
    level1: 1.0
    level2: 1.5
    level3: 2.0
