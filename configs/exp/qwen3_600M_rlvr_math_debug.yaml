run:
  name: "qwen3_600M_rlvr_math_debug"
  mode: "rlvr"

model:
  type: "hf_causal"
  id: "outputs/qwen3_600M_format_adaptation"
  dtype: "bfloat16"
  gradient_checkpointing: true

tokenizer:
  type: "hf"
  id: "Qwen/Qwen3-0.6B-Base"

data:
  type: "rlvr_math"
  source: "hf"
  train_path: "openai/gsm8k"
  name: "main"
  max_prompt_len: 512
  num_proc: 12
  subset_pct: 5.0

grpo:
  num_generations: 4
  max_prompt_length: 512
  max_completion_length: 1024
  beta: 0.001
  scale_rewards: "group"
  loss_type: "dapo"
  epsilon: 0.2
  temperature: 0.8
  top_p: 0.95
  top_k: 0
  use_vllm: true
  vllm_mode: "colocate"
  vllm_gpu_memory_utilization: 0.4
  vllm_enable_sleep_mode: false

training:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4

  learning_rate: 1.0e-5
  warmup_steps: 10
  max_steps: 120

  logging_steps: 10
  save_steps: 60
  eval_steps: 60

  bf16: true

wandb:
  tags: ["qwen3-0.6b", "rlvr", "grpo", "gsm8k", "debug", "1hr-test", "validation"]
