run:
  name: "qwen3_600M_rlvr_numina"
  mode: "rlvr"

model:
  type: "hf_causal"
  id: "outputs/qwen3_600M_format_adaptation"
  dtype: "bfloat16"
  gradient_checkpointing: true

tokenizer:
  type: "hf"
  id: "Qwen/Qwen3-0.6B-Base"

data:
  type: "rlvr_math"
  source: "hf"
  train_path: "AI-MO/NuminaMath-CoT"
  max_prompt_len: 512
  num_proc: 12

grpo:
  num_generations: 8
  max_prompt_length: 512
  max_completion_length: 1536
  beta: 0.001
  scale_rewards: "group"
  loss_type: "dapo"
  epsilon: 0.2
  temperature: 0.8
  top_p: 0.95
  top_k: 0
  use_vllm: true
  vllm_gpu_memory_utilization: 0.85

training:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8

  learning_rate: 1.0e-5
  warmup_steps: 100
  max_steps: 5000

  logging_steps: 25
  save_steps: 500
  eval_steps: 250

wandb:
  tags: ["qwen3-0.6b", "rlvr", "grpo", "numina", "proper-eval", "5k-steps"]
