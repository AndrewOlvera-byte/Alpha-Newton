run:
  name: "bc_multitask_mlp_rl_ready_medium_gnll_all"
  mode: "bc"

data:
  type: "robomimic_bc_robosuite"
  data_dir: "data/robomimic"
  tasks:
    - "lift"
    - "can"
    - "square"
    - "tool_hang"
  history_length: 3
  image_size: 160
  feature_aug_train_mode: "canonical"
  feature_aug_eval_mode: "canonical"
  obs_keys:
    low_dim:
      - "robot0_eef_pos"
      - "robot0_eef_quat"
      - "robot0_gripper_qpos"
      - "object-state"
    image:
      - "agentview_image"
      - "robot0_eye_in_hand_image"
  action_chunk_size: 1
  eval_ratio: 0.1
  hdf5_filter_key: null

robotics:
  architecture:
    type: "vla_mlp_bc"
    d_model: 384
    n_transformer_layers: 6
    n_transformer_heads: 6
    d_ff: 1536
    dropout: 0.15
    encoder_hidden_dim: 128
    controller_hidden_dim: 768
    controller_cross_attention_heads: 6
    controller_ff_dim: 1536
    action_dim: 7
    obs_dim: 53
    n_cameras: 2
    history_length: 3
    n_tasks: 4
    vit_model: "facebook/dinov2-small"
    vit_img_size: 224
    freeze_vit: true
    vis_tokens_per_camera: 32
    vis_pool_type: "avg"
    action_chunk_size: 1
    gradient_checkpointing: false
    bc_loss_type: "gnll"

training:
  per_device_train_batch_size: 96
  per_device_eval_batch_size: 96
  gradient_accumulation_steps: 1
  learning_rate: 8.0e-5
  weight_decay: 1.0e-3
  warmup_steps: 600
  max_steps: 12000
  max_grad_norm: 1.0
  logging_steps: 25
  save_steps: 300
  save_total_limit: 5
  save_optimizer_state: true
  save_final: true
  eval_steps: 50
  early_stopping_patience: 30
  selection_metric: "eval_loss"
  rollout_eval:
    enabled: false
  bf16: true
  fp8: false
  torch_compile: false
  dataloader_num_workers: 2
  dataloader_pin_memory: false
  dataloader_prefetch_factor: 2
  output_dir: "outputs/bc_multitask_mlp_rl_ready_medium_gnll_all"

wandb:
  project: "robotics-bc"
  entity: "andrewolvera"
  run_name: "bc_multitask_mlp_rl_ready_medium_gnll_all"
  tags: ["bc", "multitask", "lift", "can", "square", "tool_hang", "rl_handoff", "mlp_head", "task_embedding", "cross_attention_controller", "gnll", "learned_variance", "no_feature_aug", "160px", "medium", "loss_ablation"]
