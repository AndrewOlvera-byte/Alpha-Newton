run:
  name: "bc_multitask_ph"
  mode: "bc"

data:
  type: "robomimic_bc_robosuite"
  data_dir: "data/robomimic"
  tasks:
    - "lift"
    - "can"
    - "square"
  history_length: 3
  obs_keys:
    low_dim:
      - "robot0_eef_pos"
      - "robot0_eef_quat"
      - "robot0_gripper_qpos"
      - "object-state"
    image:
      - "agentview_image"
      - "robot0_eye_in_hand_image"
  action_chunk_size: 8
  eval_ratio: 0.1
  hdf5_filter_key: null

robotics:
  architecture:
    type: "vla_flow_matching"

    d_model: 384
    n_transformer_layers: 6
    n_transformer_heads: 6
    d_ff: 1536
    dropout: 0.1
    encoder_hidden_dim: 128

    d_dit: 256
    n_dit_layers: 4
    n_dit_heads: 4
    d_dit_ff: 1024

    action_dim: 7
    obs_dim: 23
    n_cameras: 2
    history_length: 3

    n_tasks: 3

    vit_model: "facebook/dinov2-small"
    vit_img_size: 224
    freeze_vit: true

    vis_tokens_per_camera: 64
    vis_pool_type: "attention"

    num_flow_steps: 10

    action_chunk_size: 8

    gradient_checkpointing: false

training:
  per_device_train_batch_size: 128
  per_device_eval_batch_size: 128
  gradient_accumulation_steps: 1
  learning_rate: 1.2e-4
  weight_decay: 5.0e-4
  warmup_steps: 500
  max_steps: 25000
  max_grad_norm: 1.0
  logging_steps: 50
  save_steps: 1000
  eval_steps: 250

  early_stopping_patience: 8
  bf16: true
  fp8: false
  torch_compile: false
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  output_dir: "outputs/bc_multitask_ph"

wandb:
  project: "robotics-bc"
  entity: "andrewolvera"
  run_name: "bc_multitask_ph"
  tags: ["bc", "multitask", "lift", "can", "square", "flow_matching", "dinov2", "task_embedding", "early_stopping"]
