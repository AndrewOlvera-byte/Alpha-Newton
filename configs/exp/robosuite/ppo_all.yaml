run:
  name: "ppo_all_from_bc"
  mode: "ppo"

data:
  type: "robomimic_bc_robosuite"
  data_dir: "data/robomimic"

  tasks:
    - name: lift
      weight: 0.10
    - name: can
      weight: 0.10
    - name: square
      weight: 0.40
    - name: tool_hang
      weight: 0.40
  history_length: 3

  image_size: 128
  obs_keys:
    low_dim:
      - "robot0_eef_pos"
      - "robot0_eef_quat"
      - "robot0_gripper_qpos"
      - "object-state"
    image:
      - "agentview_image"
      - "robot0_eye_in_hand_image"

robotics:
  architecture:
    type: "vla_mlp_bc"
    d_model: 384
    n_transformer_layers: 6
    n_transformer_heads: 6
    d_ff: 1536
    dropout: 0.15
    encoder_hidden_dim: 128
    controller_hidden_dim: 768
    controller_cross_attention_heads: 6
    controller_ff_dim: 1536
    action_dim: 7
    obs_dim: 53
    n_cameras: 2
    history_length: 3
    n_tasks: 4
    vit_model: "facebook/dinov2-small"
    vit_img_size: 224
    freeze_vit: true
    vis_tokens_per_camera: 32
    vis_pool_type: "avg"
    action_chunk_size: 1
    gradient_checkpointing: false
    bc_loss_type: "gnll"

  ppo:

    n_envs: 16
    n_steps: 192
    ppo_epochs: 4

    minibatch_size: 512

    compile: false
    profile_rollouts: false
    show_progress: false

    async_rollout: true
    clip_eps: 0.2
    vf_coeff: 0.5
    ent_coeff: 0.01
    gamma: 0.99
    gae_lambda: 0.95
    actor_lr: 1.0e-5
    critic_lr: 1.0e-4
    max_iterations: 500
    horizon: 400
    reward_shaping: true

    reward_fn: "dense_multitask_v1"
    value_hidden_dim: 512

    task_horizons:
      lift: 400
      can: 400
      square: 500
      tool_hang: 700

training:
  trainer_type: "ppo_robosuite"
  max_grad_norm: 0.5
  bf16: true
  logging_steps: 1

  save_steps: 100
  save_total_limit: 3
  save_optimizer_state: false
  save_bc_compatible_every_checkpoint: false
  save_final: true
  output_dir: "outputs/ppo_all_from_bc"

wandb:
  project: "robotics-ppo"
  entity: "andrewolvera"
  run_name: "ppo_all_from_bc"
  tags: ["ppo", "multitask", "lift", "can", "square", "tool_hang", "bc_finetune", "gnll"]
