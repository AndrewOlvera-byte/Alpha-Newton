version: 2
output_dir: data/flightmare/bc_v6
episodes: 5000
seed: 0
val_frac: 0.1
backend: flightgym
render: false
scene: industrial
control_hz: 100.0
max_steps: 5000
max_world_radius: 350.0
action_normalization: bounds
skip_initial_frames: 0
bounds_margin: 0.10
min_gate_completion: 0.99
gate_vehicle_radius: 0.20
z_min: 1.0

plant:
  mass: 0.73
  arm_length: 0.17
  inertia: [0.0025, 0.0021, 0.0043]
  k_thrust: 1.91e-6
  k_torque: 2.6e-7
  motor_omega_min: 150.0
  motor_omega_max: 3000.0
  motor_tau: 0.0001
  thrust_map: [1.3298253500372892e-06, 0.0038360810526746033, -1.7689986848125325]
  kappa: 0.016
  omega_max_body: [18.0, 18.0, 18.0]
  max_collective_thrust_g: 5.5

course:
  course_mode: swift_v4
  num_gates: 7
  gate_size: 1.6
  gate_approach_m: 3.0
  fixed_gate_pos_noise: 0.20
  fixed_gate_yaw_noise: 0.05
  random_start_gate: true
  gate_spacing_range: [4.0, 9.0]
  gate_lateral_jitter: 2.0
  gate_z_range: [1.5, 4.0]
  gate_yaw_step: 0.7
  gate_yaw_noise: 0.25

expert:
  controller: geometric_minjerk
  # Controller eval stress tests show this geometric/min-jerk expert is reliable
  # through strict apertures in this envelope. It is marginal above this range on
  # randomized courses, so do not widen clean expert speed without passing
  # scripts.flightmare_bc.eval_controller first.
  speed_range: [1.8, 2.6]
  lookahead_s: 0.30
  trajectory_min_segment_s: 0.80
  gains:
    kp_pos: [6.0, 6.0, 18.0]
    kd_pos: [4.0, 4.0, 11.0]
    kp_att: [10.0, 10.0, 4.0]
    kp_rate: [28.0, 28.0, 12.0]

controller_eval:
  enabled: true
  episodes: 8
  speed_bins: 2
  min_success_rate: 1.0
  min_gate_completion: 1.0

# Research note: MPCC/MPC-style experts are likely the better high-speed
# data generator once an implementation is wired in. Keep this explicit so v7
# can swap the expert without changing dataset/trainer plumbing.
mpcc:
  enabled: false
  backend: null
  binary: null
  config: null

mix:
  expert: 0.50
  synthetic_recovery: 0.35
  dagger: 0.15

recovery:
  samples_per_episode: 512
  gate_transition_probability: 0.65
  post_gate_probability: 0.50
  lateral_offset_m: [-1.4, 1.4]
  vertical_offset_m: [-0.8, 0.8]
  forward_offset_m: [-1.8, 2.4]
  yaw_error_rad: [-1.0, 1.0]
  velocity_error_mps: [-3.0, 3.0]
  omega_error_radps: [-5.0, 5.0]
  prev_action_noise: [0.05, 1.2, 1.2, 0.6]

dagger:
  enabled: true
  policy_exp: flightmare/paper/teacher/ctbr_bc
  checkpoint: outputs/paper_teacher_ctbr_bc_v5/best/model.pt
  record_deviation_threshold_m: 0.50
  max_record_deviation_m: 8.0
  terminate_deviation_m: 15.0
  record_clean_probability: 0.15
  terminate_on_gate_miss: true
  max_body_rate: 8.0

postprocess:
  transform_to_v3: true
  recompute_v3_norm_stats: true
  diag_v3_geometry: true
  diag_episodes: 20
