services:
  alpha-newton:
    build: .
    image: alpha-newton:latest
    container_name: alpha-newton
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 16gb
    volumes:
      - .:/workspace
      - ~/.cache/huggingface:/root/.cache/huggingface
    env_file:
      - .env.vllm
    environment:
      CUDA_VISIBLE_DEVICES: 0
      WANDB_API_KEY: ${WANDB_API_KEY}
    stdin_open: true
    tty: true
