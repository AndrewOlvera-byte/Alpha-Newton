services:
  alpha-newton:
    build: .
    image: alpha-newton:latest
    container_name: alpha-newton

    # GPU access for RTX 5070 Ti
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, compute, utility]

    # Shared memory for PyTorch DataLoader workers (default 64MB is too small)
    shm_size: "16gb"

    # Mount project directory for live code changes
    volumes:
      - .:/workspace
      - ./cache:/workspace/cache              # HuggingFace cache
      - ./outputs:/workspace/outputs          # Model checkpoints
      - ./experiments:/workspace/experiments  # Experiment configs
      - ~/.cache/huggingface:/root/.cache/huggingface  # Share HF cache with host

    # Keep container running for interactive CLI
    stdin_open: true
    tty: true

    # Override default command to keep alive
    command: tail -f /dev/null

    # Environment variables
    env_file:
      - .env.vllm  # vLLM configuration (FlashInfer backend, torch.compile disabled)
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - WANDB_API_KEY=${WANDB_API_KEY}  # Pass from host environment
      # NVIDIA EGL hardware rendering for MuJoCo — requires `graphics` capability
      # below so the runtime mounts libEGL_nvidia.so.0 from the host driver.
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - MUJOCO_GL=egl
      - PYOPENGL_PLATFORM=egl

    # Port mappings
    ports:
      - "7860:7860"  # Gradio web UI
      - "6006:6006"  # TensorBoard (if needed)
